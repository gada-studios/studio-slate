/* --------------------------- local storage shim ---------------------------- */
window.storage = {
  get: async (key, shared) => {
    const raw = window.localStorage.getItem("mvstore_" + key);
    if (raw === null) return null;
    return { key, value: raw, shared: !!shared };
  },
  set: async (key, value, shared) => {
    window.localStorage.setItem("mvstore_" + key, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    window.localStorage.removeItem("mvstore_" + key);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    const p = "mvstore_" + (prefix || "");
    const keys = Object.keys(window.localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(8));
    return { keys, prefix, shared: !!shared };
  },
};

const downloadJSON = (obj, filename) => {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const buildDefaultCatalog = () => {
  const items = [];
  Object.entries(DEFAULT_CATALOG_ITEMS).forEach(([group, names]) => {
    names.forEach((name) => items.push({ id: uid(), group, name }));
  });
  return items;
};
// Non-destructively merges in any default catalog items the user doesn't
// already have (by name), so existing custom items are always preserved.
const ensureCatalogDefaults = (existing) => {
  const defaults = buildDefaultCatalog();
  const defaultsByName = new Map(defaults.map((d) => [d.name, d]));
  // Migrate items still tagged with a stale/old group label (e.g. "SUP",
  // "Logistics") over to their correct current group, so they show up under
  // the right section instead of silently disappearing.
  const migrated = existing.map((item) => {
    const def = defaultsByName.get(item.name);
    if (def && !CATALOG_GROUPS.includes(item.group)) {
      return { ...item, group: def.group };
    }
    return item;
  });
  const existingNames = new Set(migrated.map((i) => i.name));
  const merged = [...migrated];
  defaults.forEach((d) => { if (!existingNames.has(d.name)) merged.push(d); });
  return merged;
};

/* ------------------------------- constants --------------------------------- */

const LS_SB_URL = "mv_supabase_url";
const LS_SB_KEY = "mv_supabase_key";
const SB_TABLE = "app_data";

/* ------------------------------- supabase sync ---------------------------------- */
/* Email/password auth + a single JSONB row per user, via Supabase's client-side
   SDK (loaded from CDN). Replaces the old Google Drive OAuth flow with a plain
   login that works the same way on every device. */

function loadSupabaseScript() {
  return new Promise((resolve, reject) => {
    if (window.supabase && window.supabase.createClient) { resolve(); return; }
    const existing = document.getElementById("mv-supabase-script");
    if (existing) {
      existing.addEventListener("load", () => resolve());
      existing.addEventListener("error", () => reject(new Error("Không tải được thư viện Supabase")));
      return;
    }
    const s = document.createElement("script");
    s.id = "mv-supabase-script";
    s.src = "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js";
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Không tải được thư viện Supabase"));
    document.head.appendChild(s);
  });
}

function useSupabaseSync(dataRef, applyRemoteData) {
  const [supabaseUrl, setSupabaseUrlState] = useState(() => localStorage.getItem(LS_SB_URL) || "");
  const [supabaseKey, setSupabaseKeyState] = useState(() => localStorage.getItem(LS_SB_KEY) || "");
  const [scriptReady, setScriptReady] = useState(false);
  const [scriptError, setScriptError] = useState(false);
  const [status, setStatus] = useState("disconnected"); // disconnected|connecting|syncing|synced|offline|error|conflict
  const [user, setUser] = useState(null);
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [conflict, setConflict] = useState(null);
  const clientRef = useRef(null);
  const pushTimer = useRef(null);
  const pendingPushRef = useRef(false);

  const saveCredentials = (url, key) => {
    localStorage.setItem(LS_SB_URL, url.trim());
    localStorage.setItem(LS_SB_KEY, key.trim());
    setSupabaseUrlState(url.trim());
    setSupabaseKeyState(key.trim());
  };

  // (Re)create the Supabase client whenever credentials change.
  useEffect(() => {
    if (!supabaseUrl || !supabaseKey) { setScriptReady(false); return; }
    let cancelled = false;
    setScriptReady(false);
    setScriptError(false);
    loadSupabaseScript()
      .then(() => {
        if (cancelled) return;
        clientRef.current = window.supabase.createClient(supabaseUrl, supabaseKey, {
          auth: { persistSession: true, autoRefreshToken: true },
        });
        setScriptReady(true);
      })
      .catch(() => { if (!cancelled) setScriptError(true); });
    return () => { cancelled = true; };
  }, [supabaseUrl, supabaseKey]);

  const fetchRemoteRow = useCallback(async (uid) => {
    const { data, error } = await clientRef.current
      .from(SB_TABLE)
      .select("data, updated_at")
      .eq("user_id", uid)
      .maybeSingle();
    if (error) throw error;
    return data;
  }, []);

  const pushToRemote = useCallback(async (uid, payload) => {
    const { error } = await clientRef.current
      .from(SB_TABLE)
      .upsert({ user_id: uid, data: payload, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
    if (error) throw error;
  }, []);

  const afterLogin = useCallback(async (loggedInUser) => {
    setStatus("connecting");
    setErrorMsg("");
    try {
      const row = await fetchRemoteRow(loggedInUser.id);
      const local = dataRef.current;
      const localUpdatedAt = local && local._meta ? local._meta.updatedAt : null;
      const localHasRealData = local && local.projects && local.projects.length > 0;

      if (!row) {
        await pushToRemote(loggedInUser.id, local);
      } else {
        const remote = row.data;
        const remoteUpdatedAt = remote && remote._meta ? remote._meta.updatedAt : row.updated_at;
        const remoteHasRealData = remote && remote.projects && remote.projects.length > 0;
        if (!remoteHasRealData) {
          await pushToRemote(loggedInUser.id, local);
        } else if (!localHasRealData) {
          applyRemoteData(remote);
        } else if (localUpdatedAt && remoteUpdatedAt && new Date(localUpdatedAt).getTime() === new Date(remoteUpdatedAt).getTime()) {
          // already in sync
        } else {
          setConflict({ local, remote });
          setStatus("conflict");
          return;
        }
      }
      setStatus("synced");
      setLastSyncedAt(new Date());
    } catch (e) {
      setErrorMsg(e.message || "Không đồng bộ được dữ liệu");
      setStatus("error");
    }
  }, [fetchRemoteRow, pushToRemote, applyRemoteData, dataRef]);

  // Restore an existing session on load, and react to future sign-in/out.
  useEffect(() => {
    if (!scriptReady) return;
    const client = clientRef.current;
    let unsub = () => {};
    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        setUser(data.session.user);
        afterLogin(data.session.user);
      }
    });
    const { data: sub } = client.auth.onAuthStateChange((event, session) => {
      setUser(session ? session.user : null);
      if (event === "SIGNED_OUT") setStatus("disconnected");
    });
    unsub = () => sub.subscription.unsubscribe();
    return unsub;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [scriptReady]);

  const signUp = useCallback(async (email, password) => {
    setStatus("connecting");
    setErrorMsg("");
    try {
      const { data, error } = await clientRef.current.auth.signUp({ email, password });
      if (error) throw error;
      if (data.user && !data.session) {
        setErrorMsg("Đã gửi email xác nhận — kiểm tra hộp thư rồi đăng nhập lại.");
        setStatus("error");
        return;
      }
      if (data.user) { setUser(data.user); await afterLogin(data.user); }
    } catch (e) {
      setErrorMsg(e.message || "Không đăng ký được");
      setStatus("error");
    }
  }, [afterLogin]);

  const signIn = useCallback(async (email, password) => {
    setStatus("connecting");
    setErrorMsg("");
    try {
      const { data, error } = await clientRef.current.auth.signInWithPassword({ email, password });
      if (error) throw error;
      setUser(data.user);
      await afterLogin(data.user);
    } catch (e) {
      setErrorMsg(e.message || "Sai email hoặc mật khẩu");
      setStatus("error");
    }
  }, [afterLogin]);

  const signOut = useCallback(async () => {
    if (clientRef.current) await clientRef.current.auth.signOut().catch(() => {});
    setUser(null);
    setStatus("disconnected");
    setLastSyncedAt(null);
  }, []);

  const resolveConflict = useCallback(async (choice) => {
    if (!conflict || !user) return;
    setStatus("syncing");
    try {
      if (choice === "remote") {
        applyRemoteData(conflict.remote);
      } else {
        await pushToRemote(user.id, conflict.local);
      }
      setConflict(null);
      setStatus("synced");
      setLastSyncedAt(new Date());
    } catch (e) {
      setErrorMsg(e.message || "Lỗi đồng bộ");
      setStatus("error");
    }
  }, [conflict, user, applyRemoteData, pushToRemote]);

  const schedulePush = useCallback((payload) => {
    pendingPushRef.current = true;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(async () => {
      if (!user || status === "disconnected") { pendingPushRef.current = false; return; }
      if (!navigator.onLine) { setStatus("offline"); return; }
      setStatus("syncing");
      try {
        await pushToRemote(user.id, payload);
        pendingPushRef.current = false;
        setStatus("synced");
        setLastSyncedAt(new Date());
      } catch (e) {
        setErrorMsg(e.message || "Lỗi đồng bộ");
        setStatus(navigator.onLine ? "error" : "offline");
      }
    }, 1500);
  }, [user, status, pushToRemote]);

  useEffect(() => {
    const onOnline = () => {
      if (pendingPushRef.current && dataRef.current) schedulePush(dataRef.current);
    };
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, [schedulePush, dataRef]);

  return {
    supabaseUrl, supabaseKey, saveCredentials, scriptReady, scriptError,
    status, user, lastSyncedAt, errorMsg, conflict,
    signUp, signIn, signOut, resolveConflict, schedulePush,
  };
}

/* ------------------------------- app data hook -------------------------------- */

function normalizeData(d) {
  const n = d || {};
  const rawLineItems = n.lineItems || [];
  const rawAssignments = n.assignments || [];
  // One-time migration: fold legacy "assignments" (personnel <-> project links)
  // into lineItems as group="Nhân sự" rows carrying personnelId, so personnel
  // cost tracking lives in one place. Idempotent: once migrated, assignments
  // is cleared, so this is a no-op on subsequent loads.
  const migratedLineItems = rawAssignments.length > 0
    ? [
        ...rawLineItems,
        ...rawAssignments.map((a) => ({
          id: uid(),
          projectId: a.projectId,
          group: "Nhân sự",
          name: a.roleInProject || "Nhân sự",
          personnelId: a.personnelId,
          quantity: 1,
          unitPrice: a.fee || 0,
          contractValue: a.fee || 0,
          extraAmount: 0,
          actualValue: a.fee || 0,
          paidAmount: a.paidAmount || 0,
          notes: "",
        })),
      ]
    : rawLineItems;
  return {
    projects: n.projects || [],
    contracts: n.contracts || [],
    milestones: n.milestones || [],
    personnel: n.personnel || [],
    assignments: [],
    transactions: n.transactions || [],
    lineItems: migratedLineItems,
    catalog: ensureCatalogDefaults(n.catalog || []),
    timelineCatalog: n.timelineCatalog || buildDefaultTimelineCatalog(),
    _meta: n._meta || { updatedAt: new Date().toISOString() },
  };
}

function useAppData() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const saveTimer = useRef(null);
  const dataRef = useRef(null);

  const applyRemoteData = useCallback((remote) => {
    const normalized = normalizeData(remote);
    dataRef.current = normalized;
    setData(normalized);
    window.storage.set(STORAGE_KEY, JSON.stringify(normalized), false).catch(() => {});
  }, []);

  const sync = useSupabaseSync(dataRef, applyRemoteData);
  const syncRef = useRef(null);
  syncRef.current = sync;

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        let initial;
        if (res && res.value) {
          initial = normalizeData(JSON.parse(res.value));
        } else {
          initial = normalizeData(seedData());
          initial._meta = { updatedAt: new Date().toISOString() };
          await window.storage.set(STORAGE_KEY, JSON.stringify(initial), false);
        }
        dataRef.current = initial;
        setData(initial);
      } catch (e) {
        const seed = normalizeData(seedData());
        seed._meta = { updatedAt: new Date().toISOString() };
        dataRef.current = seed;
        setData(seed);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const persist = useCallback((next) => {
    next._meta = { updatedAt: new Date().toISOString() };
    dataRef.current = next;
    setData(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const result = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
        if (!result) setSaveError(true);
        else setSaveError(false);
      } catch (e) {
        setSaveError(true);
      }
    }, 250);
    if (syncRef.current) syncRef.current.schedulePush(next);
  }, []);

  const resetToSample = useCallback(async () => {
    const seed = normalizeData(seedData());
    seed._meta = { updatedAt: new Date().toISOString() };
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(seed), false);
    } catch (e) {}
    dataRef.current = seed;
    setData(seed);
    if (syncRef.current) syncRef.current.schedulePush(seed);
  }, []);

  const clearAll = useCallback(async () => {
    const empty = normalizeData({});
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(empty), false);
    } catch (e) {}
    dataRef.current = empty;
    setData(empty);
  }, []);

  return { data, loading, saveError, persist, resetToSample, clearAll, sync };
}

/* ------------------------------- form: project ------------------------------ */

function ProjectForm({ initial, onSave, onClose, timelineCatalog, onAddTimelineCatalogItem, catalog, onAddCatalogItem, personnel, onQuickAddPersonnel }) {
  const [f, setF] = useState(
    initial || { name: "", client: "", director: "", status: "Chưa bắt đầu", progress: 0, startDate: todayISO(), endDate: "", budget: "", description: "" }
  );
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const isNew = !initial;
  const STEPS = isNew ? [
    { id: 1, label: "Thông tin" },
    { id: 2, label: "Timeline" },
    { id: 3, label: "Bảng dự toán" },
  ] : [{ id: 1, label: "Thông tin" }];
  const [step, setStep] = useState(1);

  const [pendingMilestones, setPendingMilestones] = useState([]);
  const [showLocalMilestoneForm, setShowLocalMilestoneForm] = useState(false);
  const [editingLocalMilestone, setEditingLocalMilestone] = useState(null);
  const addOnDate = (dateKey, name) => {
    setPendingMilestones((prev) => [...prev, { id: uid(), name, date: dateKey, status: "Chưa bắt đầu" }]);
  };
  const moveLocalMilestoneToDate = (id, dateKey) => {
    setPendingMilestones((prev) => prev.map((m) => (m.id === id ? { ...m, date: dateKey } : m)));
  };
  const saveLocalMilestone = (m) => {
    setPendingMilestones((prev) => (m.id && prev.some((x) => x.id === m.id) ? prev.map((x) => (x.id === m.id ? m : x)) : [...prev, { ...m, id: uid() }]));
    setShowLocalMilestoneForm(false);
    setEditingLocalMilestone(null);
  };
  const deleteLocalMilestone = (id) => setPendingMilestones((prev) => prev.filter((m) => m.id !== id));

  const [pendingLineItems, setPendingLineItems] = useState([]);
  const [showLocalLineItemForm, setShowLocalLineItemForm] = useState(false);
  const [editingLocalLineItem, setEditingLocalLineItem] = useState(null);
  const quickAddLocalLineItem = (catalogItem) => {
    setEditingLocalLineItem({ name: catalogItem.name, group: catalogItem.group || CATALOG_GROUPS[0], quantity: 1, unitPrice: "", contractValue: "", extraAmount: "", paidAmount: "", notes: "" });
    setShowLocalLineItemForm(true);
  };
  const saveLocalLineItem = (l) => {
    setPendingLineItems((prev) => (l.id && prev.some((x) => x.id === l.id) ? prev.map((x) => (x.id === l.id ? l : x)) : [...prev, { ...l, id: uid() }]));
    setShowLocalLineItemForm(false);
    setEditingLocalLineItem(null);
  };
  const deleteLocalLineItem = (id) => setPendingLineItems((prev) => prev.filter((l) => l.id !== id));
  const handleLocalCatalogDrop = (e) => {
    e.preventDefault();
    try {
      const parsed = JSON.parse(e.dataTransfer.getData("text/plain"));
      if (parsed && parsed.name) quickAddLocalLineItem(parsed);
    } catch (err) {}
  };
  const pendingTotal = pendingLineItems.reduce((s, l) => s + (Number(l.contractValue) || 0), 0);

  const goNext = () => {
    if (step === 1 && !f.name.trim()) return;
    setStep((s) => Math.min(s + 1, STEPS.length));
  };
  const goBack = () => setStep((s) => Math.max(s - 1, 1));

  const handleFinalSave = () => {
    if (!f.name.trim()) { setStep(1); return; }
    onSave({ ...f, progress: Number(f.progress) || 0, budget: Number(f.budget) || 0 }, pendingMilestones, pendingLineItems);
  };

  return (
    <Modal title={initial ? "Sửa dự án" : "Dự án mới"} onClose={onClose} size={isNew ? "xl" : undefined}>
      {isNew && (
        <div className="mv-wizard-steps">
          {STEPS.map((s) => (
            <div key={s.id} className={`mv-wizard-step ${step === s.id ? "mv-wizard-step-active" : ""} ${step > s.id ? "mv-wizard-step-done" : ""}`}>
              <span className="mv-wizard-step-num">{step > s.id ? <CheckCircle2 size={13} /> : s.id}</span>
              {s.label}
            </div>
          ))}
        </div>
      )}

      {step === 1 && (
        <>
          <div className="mv-form-grid">
            <Field label="Tên dự án / MV"><input className="mv-input" value={f.name} onChange={set("name")} placeholder="VD: Cơn Mưa Ngang Qua" /></Field>
            <Field label="Khách hàng"><input className="mv-input" value={f.client} onChange={set("client")} /></Field>
            <Field label="Đạo diễn"><input className="mv-input" value={f.director} onChange={set("director")} /></Field>
            <Field label="Trạng thái">
              <select className="mv-input" value={f.status} onChange={set("status")}>
                {PROJECT_STATUSES.map((s) => <option key={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="Tiến độ (%)"><input type="number" min="0" max="100" className="mv-input" value={f.progress} onChange={set("progress")} /></Field>
            <Field label="Ngày bắt đầu"><input type="date" className="mv-input" value={f.startDate} onChange={set("startDate")} /></Field>
            <Field label="Ngày kết thúc dự kiến"><input type="date" className="mv-input" value={f.endDate} onChange={set("endDate")} /></Field>
          </div>
          <Field label="Mô tả"><textarea className="mv-input" rows={3} value={f.description} onChange={set("description")} /></Field>
        </>
      )}

      {step === 2 && isNew && (
        <div>
          <h4 className="mv-inline-timeline-title"><Calendar size={15} /> Timeline dự án (tuỳ chọn — có thể thêm sau)</h4>
          <MilestoneCalendar
            milestones={pendingMilestones}
            onEdit={(m) => { setEditingLocalMilestone(m); setShowLocalMilestoneForm(true); }}
            onAddOnDate={addOnDate}
            onMoveToDate={moveLocalMilestoneToDate}
            onDelete={deleteLocalMilestone}
            timelineCatalog={timelineCatalog}
            projectName={f.name || "Dự án mới"}
          />
          {pendingMilestones.length > 0 && (
            <div className="mv-inline-milestone-list">
              {pendingMilestones.map((m) => (
                <div key={m.id} className="mv-inline-milestone-chip">
                  <span>{m.name} · {fmtDate(m.date)}</span>
                  <button className="mv-icon-btn" onClick={() => deleteLocalMilestone(m.id)}><X size={12} /></button>
                </div>
              ))}
            </div>
          )}
          {showLocalMilestoneForm && (
            <MilestoneForm
              initial={editingLocalMilestone}
              onClose={() => { setShowLocalMilestoneForm(false); setEditingLocalMilestone(null); }}
              onSave={saveLocalMilestone}
            />
          )}
        </div>
      )}

      {step === 3 && isNew && (
        <div onDragOver={(e) => e.preventDefault()} onDrop={handleLocalCatalogDrop}>
          <h4 className="mv-inline-timeline-title"><Wallet size={15} /> Bảng dự toán gửi khách (tuỳ chọn — có thể thêm sau)</h4>
          <CatalogPanel catalog={catalog} onPick={quickAddLocalLineItem} />
          {pendingLineItems.length === 0 ? (
            <p className="mv-empty-note">Kéo hoặc bấm hạng mục ở trên để thêm vào bảng dự toán. Số liệu này cũng sẽ dùng để theo dõi thực chi sau này.</p>
          ) : (() => {
            const grouped = CATALOG_GROUPS.map((g) => ({ group: g, items: pendingLineItems.filter((l) => (l.group || "Miscellaneous") === g) }))
              .concat([{ group: "Khác", items: pendingLineItems.filter((l) => !CATALOG_GROUPS.includes(l.group)) }])
              .filter((g) => g.items.length > 0);
            const vat = pendingTotal * 0.08;
            return (
              <table className="mv-quote-table" style={{ marginTop: 14 }}>
                <thead>
                  <tr><th>Hạng mục</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr>
                </thead>
                {grouped.map(({ group, items }) => (
                  <tbody key={group}>
                    <tr className="mv-quote-group-row"><td colSpan={5}>{group}</td></tr>
                    {items.map((l) => (
                      <tr key={l.id} className="mv-quote-row-clickable" onClick={() => { setEditingLocalLineItem(l); setShowLocalLineItemForm(true); }}>
                        <td>{l.name}</td>
                        <td className="mv-mono-date">{l.quantity || 1}</td>
                        <td className="mv-mono-money">{fmtVND(l.unitPrice || 0)}</td>
                        <td className="mv-quote-amount-cell mv-mono-money">{fmtVND(l.contractValue)}</td>
                        <td onClick={(e) => e.stopPropagation()}>
                          <button className="mv-icon-btn" onClick={() => { setEditingLocalLineItem(l); setShowLocalLineItemForm(true); }}><Pencil size={14} /></button>
                          <button className="mv-icon-btn" onClick={() => deleteLocalLineItem(l.id)}><Trash2 size={14} /></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                ))}
                <tfoot>
                  <tr><td colSpan={3} className="mv-quote-total-label">Tổng dự toán (chưa VAT)</td><td className="mv-quote-amount-cell mv-mono-money">{fmtVND(pendingTotal)}</td><td></td></tr>
                  <tr><td colSpan={3} className="mv-quote-total-label">Thuế VAT (8%)</td><td className="mv-quote-amount-cell mv-mono-money">{fmtVND(vat)}</td><td></td></tr>
                  <tr><td colSpan={3} className="mv-quote-total-label">TỔNG SAU VAT</td><td className="mv-quote-amount-cell mv-mono-money mv-quote-total-value">{fmtVND(pendingTotal + vat)}</td><td></td></tr>
                </tfoot>
              </table>
            );
          })()}
          {showLocalLineItemForm && (
            <LineItemForm
              initial={editingLocalLineItem}
              onClose={() => { setShowLocalLineItemForm(false); setEditingLocalLineItem(null); }}
              onSave={saveLocalLineItem}
              personnel={personnel}
              onQuickAddPersonnel={onQuickAddPersonnel}
            />
          )}
        </div>
      )}

      <div className="mv-modal-actions">
        <button className="mv-btn mv-btn-ghost" onClick={onClose}>Huỷ</button>
        {step > 1 && <button className="mv-btn mv-btn-ghost" onClick={goBack}>Quay lại</button>}
        {isNew && step < STEPS.length ? (
          <button className="mv-btn mv-btn-primary" onClick={goNext}>Tiếp theo</button>
        ) : (
          <button className="mv-btn mv-btn-primary" onClick={handleFinalSave}>Lưu dự án</button>
        )}
      </div>
    </Modal>
  );
}

/* ------------------------------ form: line item (hạng mục) ------------------------------ */

function LineItemForm({ initial, onSave, onClose, personnel, onQuickAddPersonnel }) {
  const [f, setF] = useState(() => {
    if (initial) {
      const contractValue = initial.contractValue || 0;
      return { quantity: 1, unitPrice: contractValue, group: CATALOG_GROUPS[0], personnelId: "", extraAmount: 0, actualValue: contractValue, ...initial };
    }
    return { name: "", group: CATALOG_GROUPS[0], personnelId: "", quantity: 1, unitPrice: "", contractValue: "", extraAmount: "", actualValue: "", paidAmount: "", notes: "" };
  });
  const [showQuickAddPerson, setShowQuickAddPerson] = useState(false);
  const [quickPersonName, setQuickPersonName] = useState("");
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const computedContractValue = (Number(f.quantity) || 0) * (Number(f.unitPrice) || 0);
  const totalBilledToClient = computedContractValue + (Number(f.extraAmount) || 0);

  const handleQuickAddPerson = () => {
    if (!quickPersonName.trim()) return;
    const newPerson = onQuickAddPersonnel({ name: quickPersonName.trim(), role: f.name || "", phone: "", email: "", dayRate: 0 });
    setF({ ...f, personnelId: newPerson.id });
    setQuickPersonName("");
    setShowQuickAddPerson(false);
  };

  return (
    <Modal title={initial && initial.id ? "Sửa hạng mục" : "Hạng mục mới"} onClose={onClose}>
      <div className="mv-form-grid">
        <Field label="Tên hạng mục">
          <input className="mv-input" list="mv-expense-category-list" value={f.name} onChange={set("name")} placeholder="VD: Thuê thiết bị, Quay phim, Thuê bối cảnh..." />
          <datalist id="mv-expense-category-list">
            {EXPENSE_CATEGORIES.map((c) => <option key={c} value={c} />)}
          </datalist>
        </Field>
        <Field label="Nhóm">
          <select className="mv-input" value={f.group} onChange={set("group")}>
            {CATALOG_GROUPS.map((g) => <option key={g}>{g}</option>)}
          </select>
        </Field>
      </div>
      {f.group === "Nhân sự" && personnel && (
        <Field label="Nhân sự phụ trách">
          {showQuickAddPerson ? (
            <div className="mv-catalog-add-form">
              <input className="mv-input" placeholder="Tên nhân sự mới" value={quickPersonName} onChange={(e) => setQuickPersonName(e.target.value)} />
              <button className="mv-btn mv-btn-primary mv-btn-sm" onClick={handleQuickAddPerson}>Thêm</button>
              <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => setShowQuickAddPerson(false)}>Huỷ</button>
            </div>
          ) : (
            <div style={{ display: "flex", gap: 8 }}>
              <select className="mv-input" value={f.personnelId} onChange={set("personnelId")}>
                <option value="">— Chưa gán —</option>
                {personnel.map((p) => <option key={p.id} value={p.id}>{p.name} — {p.role}</option>)}
              </select>
              <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => setShowQuickAddPerson(true)}>+ Nhân sự mới</button>
            </div>
          )}
        </Field>
      )}
      <div className="mv-form-grid">
        <Field label="Số lượng"><input type="number" className="mv-input" value={f.quantity} onChange={set("quantity")} /></Field>
        <Field label="Đơn giá — báo khách (VND)"><input type="number" className="mv-input" value={f.unitPrice} onChange={set("unitPrice")} /></Field>
      </div>
      <div className="mv-form-grid">
        <Field label="Phát sinh — báo thêm cho khách (VND)"><input type="number" className="mv-input" value={f.extraAmount} onChange={set("extraAmount")} placeholder="0 nếu không có phát sinh" /></Field>
        <Field label="Tổng báo khách (tự tính)"><input className="mv-input" value={fmtVND(totalBilledToClient)} disabled /></Field>
      </div>
      <div className="mv-form-grid">
        <Field label="Thực chi — chi phí nội bộ (VND)"><input type="number" className="mv-input" value={f.actualValue} onChange={set("actualValue")} placeholder="Số tiền công ty thực sự chi ra" /></Field>
        <Field label="Đã thanh toán (VND)"><input type="number" className="mv-input" value={f.paidAmount} onChange={set("paidAmount")} /></Field>
      </div>
      <Field label="Ghi chú"><textarea className="mv-input" rows={2} value={f.notes} onChange={set("notes")} placeholder="VD: lý do phát sinh, thoả thuận thêm..." /></Field>
      <div className="mv-modal-actions">
        <button className="mv-btn mv-btn-ghost" onClick={onClose}>Huỷ</button>
        <button
          className="mv-btn mv-btn-primary"
          onClick={() => f.name.trim() && onSave({
            ...f,
            quantity: Number(f.quantity) || 1,
            unitPrice: Number(f.unitPrice) || 0,
            contractValue: computedContractValue,
            extraAmount: Number(f.extraAmount) || 0,
            actualValue: Number(f.actualValue) || 0,
            paidAmount: Number(f.paidAmount) || 0,
          })}
        >
          Lưu hạng mục
        </button>
      </div>
    </Modal>
  );
}

        <input type="checkbox" checked={!!f.isExtra} onChange={(e) => setF({ ...f, isExtra: e.target.checked })} />
        <span>Phát sinh (chi phí ngoài ngân sách/kế hoạch ban đầu)</span>

        <button className="mv-btn mv-btn-ghost" onClick={onClose}>Huỷ</button>

function CompanyCalendar({ data, openProject }) {
  const todayKey = todayISO();
  const [viewDate, setViewDate] = useState(new Date());

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const milestonesByDay = {};
  data.milestones.forEach((m) => {
    if (!m.date) return;
    const dt = new Date(m.date);
    if (dt.getFullYear() === year && dt.getMonth() === month) {
      const key = dt.getDate();
      const proj = data.projects.find((p) => p.id === m.projectId);
      (milestonesByDay[key] = milestonesByDay[key] || []).push({ ...m, projectName: proj?.name || "—" });
    }
  });

  const goMonth = (delta) => setViewDate(new Date(year, month + delta, 1));
  const handlePrint = () => window.print();

  return (
    <div className="mv-panel">
      <div className="mv-panel-head mv-no-print">
        <h3 className="mv-panel-title"><Calendar size={16} /> Lịch tổng quan toàn công ty</h3>
        <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={handlePrint}><FileText size={14} /> Tải PDF</button>
      </div>
      <div className="mv-calendar" id="mv-printable-company-calendar">
        <div className="mv-print-only mv-print-header">
          <img src={LOGO_DATA_URI} alt="Logo" className="mv-print-logo" />
          <div className="mv-print-title">Lịch tổng quan toàn công ty</div>
        </div>
        <div className="mv-calendar-head">
          <button className="mv-icon-btn mv-no-print" onClick={() => goMonth(-1)}><ChevronRight size={16} style={{ transform: "rotate(180deg)" }} /></button>
          <span className="mv-calendar-title">{MONTH_LABELS[month]} {year}</span>
          <button className="mv-icon-btn mv-no-print" onClick={() => goMonth(1)}><ChevronRight size={16} /></button>
        </div>
        <div className="mv-calendar-weekdays">
          {WEEKDAY_LABELS.map((w) => <div key={w} className="mv-calendar-weekday">{w}</div>)}
        </div>
        <div className="mv-calendar-grid">
          {cells.map((d, i) => {
            if (d === null) return <div key={i} className="mv-calendar-cell mv-calendar-cell-blank" />;
            const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
            const dayMilestones = milestonesByDay[d] || [];
            const isToday = dateKey === todayKey;
            return (
              <div key={i} className={`mv-calendar-cell ${isToday ? "mv-calendar-cell-today" : ""}`}>
                <div className="mv-calendar-daynum">{d}</div>
                <div className="mv-calendar-chips">
                  {dayMilestones.map((m) => (
                    <button
                      key={m.id}
                      className="mv-calendar-chip"
                      style={{ "--chip-color": STATUS_META[m.status]?.color || "#9C948A" }}
                      onClick={() => openProject(m.projectId)}
                      title={`${m.projectName} — ${m.name}`}
                    >
                      {m.projectName}: {m.name}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Dashboard({ data, openProject }) {
  const { projects, milestones, contracts, lineItems } = data;
  const active = projects.filter((p) => !["Hoàn thành", "Tạm dừng"].includes(p.status));

  const revenueOf = (projectId) => {
    const items = lineItems.filter((l) => l.projectId === projectId);
    return items.reduce((s, l) => s + l.contractValue + (l.extraAmount || 0), 0);
  };
  const costOf = (projectId) => lineItems.filter((l) => l.projectId === projectId).reduce((s, l) => s + l.actualValue, 0);

  const totalThu = projects.reduce((s, p) => s + revenueOf(p.id), 0);
  const totalChi = projects.reduce((s, p) => s + costOf(p.id), 0);
  const totalProfit = totalThu - totalChi;

  const upcoming = milestones
    .filter((m) => m.status !== "Hoàn thành")
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 6);

  // Group revenue/profit by the month each project starts in.
  const monthMap = {};
  projects.forEach((p) => {
    if (!p.startDate) return;
    const dt = new Date(p.startDate);
    if (isNaN(dt)) return;
    const key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`;
    const revenue = revenueOf(p.id);
    const cost = costOf(p.id);
    if (!monthMap[key]) monthMap[key] = { key, year: dt.getFullYear(), month: dt.getMonth(), revenue: 0, cost: 0 };
    monthMap[key].revenue += revenue;
    monthMap[key].cost += cost;
  });
  const monthlyRows = Object.values(monthMap).sort((a, b) => (a.key < b.key ? 1 : -1));

  return (
    <div>
      <div className="mv-stats-row mv-stats-row-5">
        <StatCard label="Tổng số dự án" value={projects.length} />
        <StatCard label="Đang triển khai" value={active.length} tone="#D4A537" />
        <StatCard label="Tổng doanh thu" value={fmtVND(totalThu)} tone="#5FB77E" />
        <StatCard label="Tổng chi phí" value={fmtVND(totalChi)} tone="#C1443C" />
        <StatCard label="Tổng lợi nhuận" value={fmtVND(totalProfit)} tone={totalProfit >= 0 ? "#D4A537" : "#C1443C"} />
      </div>

      <div className="mv-panel">
        <h3 className="mv-panel-title"><Wallet size={16} /> Doanh thu &amp; lợi nhuận theo tháng</h3>
        {monthlyRows.length === 0 ? (
          <p className="mv-empty-note">Chưa có dự án nào có ngày bắt đầu để thống kê theo tháng.</p>
        ) : (
          <table className="mv-quote-table">
            <thead>
              <tr>
                <th>Tháng</th>
                <th>Doanh thu</th>
                <th>Chi phí</th>
                <th>Lợi nhuận</th>
              </tr>
            </thead>
            <tbody>
              {monthlyRows.map((row) => {
                const profit = row.revenue - row.cost;
                return (
                  <tr key={row.key}>
                    <td>{MONTH_LABELS[row.month]} {row.year}</td>
                    <td className="mv-mono-money" style={{ color: "#5FB77E" }}>{fmtVND(row.revenue)}</td>
                    <td className="mv-mono-money" style={{ color: "#C1443C" }}>{fmtVND(row.cost)}</td>
                    <td className="mv-quote-amount-cell mv-mono-money" style={{ color: profit >= 0 ? "#D4A537" : "#C1443C" }}>{fmtVND(profit)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
        <p className="mv-row-sub" style={{ marginTop: 10 }}>* Tính theo tháng bắt đầu của dự án (ngày bắt đầu trong "Tổng quan" dự án).</p>
      </div>

      <div className="mv-dash-grid">
        <div className="mv-panel">
          <h3 className="mv-panel-title"><Film size={16} /> Dự án đang hoạt động</h3>
          {active.length === 0 && <p className="mv-empty-note">Chưa có dự án nào đang hoạt động.</p>}
          {active.map((p) => (
            <div key={p.id} className="mv-mini-row" onClick={() => openProject(p.id)}>
              <div className="mv-mini-row-main">
                <span className="mv-mini-name">{p.name}</span>
                <Badge status={p.status} />
              </div>
              <ProgressBar value={p.progress} />
            </div>
          ))}
        </div>

        <div className="mv-panel">
          <h3 className="mv-panel-title"><Calendar size={16} /> Mốc tiến độ sắp tới</h3>
          {upcoming.length === 0 && <p className="mv-empty-note">Không có mốc tiến độ nào sắp tới.</p>}
          {upcoming.map((m) => {
            const proj = projects.find((p) => p.id === m.projectId);
            return (
              <div key={m.id} className="mv-mini-row" onClick={() => proj && openProject(proj.id)}>
                <div className="mv-mini-row-main">
                  <span className="mv-mini-name">{m.name}</span>
                  <span className="mv-mono-date">{fmtDate(m.date)}</span>
                </div>
                <div className="mv-mini-sub">{proj?.name || "—"} <Badge status={m.status} /></div>
              </div>
            );
          })}
        </div>
      </div>

      <CompanyCalendar data={data} openProject={openProject} />
    </div>
  );
}

function ProjectsList({ data, persist, openProject }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("Tất cả");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const filtered = data.projects.filter((p) => {
    const matchesQuery = (p.name + p.client + p.director).toLowerCase().includes(query.toLowerCase());
    const matchesStatus = statusFilter === "Tất cả" || p.status === statusFilter;
    return matchesQuery && matchesStatus;
  });

  const saveProject = (proj, pendingMilestones, pendingLineItems) => {
    const next = { ...data };
    let newProjectId = proj.id;
    if (proj.id) {
      next.projects = data.projects.map((p) => (p.id === proj.id ? proj : p));
    } else {
      newProjectId = uid();
      next.projects = [...data.projects, { ...proj, id: newProjectId }];
    }
    if (pendingMilestones && pendingMilestones.length > 0) {
      next.milestones = [
        ...data.milestones,
        ...pendingMilestones.map((m) => ({ ...m, id: uid(), projectId: newProjectId })),
      ];
    }
    if (pendingLineItems && pendingLineItems.length > 0) {
      next.lineItems = [
        ...data.lineItems,
        ...pendingLineItems.map((l) => ({ ...l, id: uid(), projectId: newProjectId })),
      ];
    }
    persist(next);
    setShowForm(false);
    setEditing(null);
  };

  const addCatalogItem = ({ group, name }) => {
    persist({ ...data, catalog: [...data.catalog, { id: uid(), group, name }] });
  };

  const addTimelineCatalogItem = ({ group, name }) => {
    persist({ ...data, timelineCatalog: [...data.timelineCatalog, { id: uid(), group, name }] });
  };

  const quickAddPersonnelGlobal = (personData) => {
    const newPerson = { ...personData, id: uid() };
    persist({ ...data, personnel: [...data.personnel, newPerson] });
    return newPerson;
  };

  const deleteProject = (id) => {
    const next = {
      ...data,
      projects: data.projects.filter((p) => p.id !== id),
      contracts: data.contracts.filter((c) => c.projectId !== id),
      milestones: data.milestones.filter((m) => m.projectId !== id),
      assignments: data.assignments.filter((a) => a.projectId !== id),
      transactions: data.transactions.filter((t) => t.projectId !== id),
      lineItems: data.lineItems.filter((l) => l.projectId !== id),
    };
    persist(next);
    setConfirmDelete(null);
  };

  return (
    <div>
      <div className="mv-toolbar">
        <div className="mv-search">
          <Search size={16} />
          <input placeholder="Tìm dự án, khách hàng, đạo diễn..." value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
        <select className="mv-input mv-filter" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option>Tất cả</option>
          {PROJECT_STATUSES.map((s) => <option key={s}>{s}</option>)}
        </select>
        <button className="mv-btn mv-btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}>
          <Plus size={16} /> Dự án mới
        </button>
      </div>

      {filtered.length === 0 && <p className="mv-empty-note">Không tìm thấy dự án nào.</p>}

      <div className="mv-slate-grid">
        {filtered.map((p) => (
          <div key={p.id}>
            {confirmDelete === p.id ? (
              <div className="mv-slate mv-slate-confirm">
                <ConfirmBar text={`Xoá dự án "${p.name}"? Toàn bộ hợp đồng, timeline, nhân sự, dòng tiền liên quan cũng sẽ bị xoá.`} onConfirm={() => deleteProject(p.id)} onCancel={() => setConfirmDelete(null)} />
              </div>
            ) : (
              <ProjectSlateCard
                p={p}
                onOpen={() => openProject(p.id)}
                onEdit={() => { setEditing(p); setShowForm(true); }}
                onDelete={() => setConfirmDelete(p.id)}
              />
            )}
          </div>
        ))}
      </div>

      {showForm && (
        <ProjectForm
          initial={editing}
          onClose={() => { setShowForm(false); setEditing(null); }}
          onSave={saveProject}
          timelineCatalog={data.timelineCatalog}
          onAddTimelineCatalogItem={addTimelineCatalogItem}
          catalog={data.catalog}
          onAddCatalogItem={addCatalogItem}
          personnel={data.personnel}
          onQuickAddPersonnel={quickAddPersonnelGlobal}
        />
      )}
    </div>
  );
}

function MilestoneCalendar({ milestones, onEdit, onAddOnDate, onMoveToDate, onDelete, timelineCatalog, projectName }) {
  const todayKey = todayISO();
  const initialMonth = milestones.length > 0 ? new Date(milestones[0].date) : new Date();
  const [viewDate, setViewDate] = useState(new Date(initialMonth.getFullYear(), initialMonth.getMonth(), 1));

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  // Monday-first weekday index (0 = Monday ... 6 = Sunday)
  const leadingBlanks = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const milestonesByDay = {};
  milestones.forEach((m) => {
    if (!m.date) return;
    const dt = new Date(m.date);
    if (dt.getFullYear() === year && dt.getMonth() === month) {
      const key = dt.getDate();
      (milestonesByDay[key] = milestonesByDay[key] || []).push(m);
    }
  });

  const goMonth = (delta) => setViewDate(new Date(year, month + delta, 1));

  const handleChipDragStart = (e, m) => {
    e.dataTransfer.setData("text/plain", JSON.stringify({ type: "existing", id: m.id }));
    e.dataTransfer.effectAllowed = "move";
  };

  const handleDrop = (e, d) => {
    e.preventDefault();
    try {
      const parsed = JSON.parse(e.dataTransfer.getData("text/plain"));
      const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      if (parsed && parsed.type === "existing" && parsed.id) {
        onMoveToDate(parsed.id, dateKey);
      } else if (parsed && parsed.name) {
        onAddOnDate(dateKey, parsed.name);
      }
    } catch (err) {}
  };

  const handlePrint = () => window.print();

  return (
    <div>
      {timelineCatalog && (
        <TimelineCatalogPanel
          catalog={timelineCatalog}
          onAddCustomOneOff={(name) => onEdit({ name, date: todayKey, status: "Chưa bắt đầu" })}
        />
      )}

      <div className="mv-calendar-toolbar mv-no-print">
        <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={handlePrint}><FileText size={14} /> Tải PDF</button>
      </div>

      <div className="mv-calendar" id="mv-printable-calendar">
        <div className="mv-print-only mv-print-header">
          <img src={LOGO_DATA_URI} alt="Logo" className="mv-print-logo" />
          <div className="mv-print-title">{projectName} — Timeline</div>
        </div>
        <div className="mv-calendar-head">
          <button className="mv-icon-btn mv-no-print" onClick={() => goMonth(-1)}><ChevronRight size={16} style={{ transform: "rotate(180deg)" }} /></button>
          <span className="mv-calendar-title">{MONTH_LABELS[month]} {year}</span>
          <button className="mv-icon-btn mv-no-print" onClick={() => goMonth(1)}><ChevronRight size={16} /></button>
        </div>
        <div className="mv-calendar-weekdays">
          {WEEKDAY_LABELS.map((w) => <div key={w} className="mv-calendar-weekday">{w}</div>)}
        </div>
        <div className="mv-calendar-grid">
          {cells.map((d, i) => {
            if (d === null) return <div key={i} className="mv-calendar-cell mv-calendar-cell-blank" />;
            const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
            const dayMilestones = milestonesByDay[d] || [];
            const isToday = dateKey === todayKey;
            return (
              <div
                key={i}
                className={`mv-calendar-cell ${isToday ? "mv-calendar-cell-today" : ""}`}
                onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = e.dataTransfer.effectAllowed === "move" ? "move" : "copy"; e.currentTarget.classList.add("mv-calendar-cell-dragover"); }}
                onDragLeave={(e) => { e.currentTarget.classList.remove("mv-calendar-cell-dragover"); }}
                onDrop={(e) => { e.currentTarget.classList.remove("mv-calendar-cell-dragover"); handleDrop(e, d); }}
              >
                <div className="mv-calendar-daynum">{d}</div>
                <div className="mv-calendar-chips">
                  {dayMilestones.map((m) => (
                    <div key={m.id} className="mv-calendar-chip-wrap">
                      <button
                        className="mv-calendar-chip mv-no-print-interactive"
                        style={{ "--chip-color": STATUS_META[m.status]?.color || "#9C948A" }}
                        draggable
                        onDragStart={(e) => handleChipDragStart(e, m)}
                        onClick={() => onEdit(m)}
                        title={`${m.name} — kéo để đổi ngày`}
                      >
                        {m.name}
                      </button>
                      {onDelete && (
                        <button
                          className="mv-calendar-chip-delete mv-no-print"
                          title="Xoá mốc này"
                          onClick={(e) => { e.stopPropagation(); onDelete(m.id); }}
                        >
                          <X size={10} />
                        </button>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}
