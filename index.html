/* --------------------------- local storage shim ---------------------------- */
window.storage = {
  get: async (key, shared) => {
    const raw = window.localStorage.getItem("mvstore_" + key);
    if (raw === null) return null;
    return { key, value: raw, shared: !!shared };
  },
  set: async (key, value, shared) => {
    window.localStorage.setItem("mvstore_" + key, value);
    return { key, value, shared: !!shared };
  },
  delete: async (key, shared) => {
    window.localStorage.removeItem("mvstore_" + key);
    return { key, deleted: true, shared: !!shared };
  },
  list: async (prefix, shared) => {
    const p = "mvstore_" + (prefix || "");
    const keys = Object.keys(window.localStorage).filter((k) => k.startsWith(p)).map((k) => k.slice(8));
    return { keys, prefix, shared: !!shared };
  },
};

/* ------------------------------- constants --------------------------------- */

const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_FILE_NAME = "studio-slate-data.json";
const LS_CLIENT_ID = "mv_google_client_id";
const LS_CONNECTED = "mv_drive_connected";
const LS_FILE_ID = "mv_drive_file_id";

/* ------------------------------- drive sync ---------------------------------- */
/* Thin wrapper around Google Identity Services (token client) + Drive v3 REST
   API, using the drive.file scope (app only ever sees files it created). */

function loadGoogleScript() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.accounts && window.google.accounts.oauth2) {
      resolve();
      return;
    }
    const existing = document.getElementById("mv-gsi-script");
    if (existing) {
      existing.addEventListener("load", () => resolve());
      existing.addEventListener("error", () => reject(new Error("Không tải được Google Identity Services")));
      return;
    }
    const s = document.createElement("script");
    s.id = "mv-gsi-script";
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Không tải được Google Identity Services"));
    document.head.appendChild(s);
  });
}

function useDriveSync(dataRef, applyRemoteData) {
  const [clientId, setClientId] = useState(() => localStorage.getItem(LS_CLIENT_ID) || "");
  const [status, setStatus] = useState("disconnected"); // disconnected | connecting | syncing | synced | offline | error | conflict
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [errorMsg, setErrorMsg] = useState("");
  const [conflict, setConflict] = useState(null); // { local, remote }
  const tokenClientRef = useRef(null);
  const accessTokenRef = useRef("");
  const fileIdRef = useRef(localStorage.getItem(LS_FILE_ID) || "");
  const pushTimer = useRef(null);
  const pendingPushRef = useRef(false);

  const saveClientId = (id) => {
    localStorage.setItem(LS_CLIENT_ID, id.trim());
    setClientId(id.trim());
  };

  const ensureTokenClient = useCallback(async () => {
    if (!clientId) throw new Error("Chưa có Client ID.");
    await loadGoogleScript();
    if (!tokenClientRef.current) {
      tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: DRIVE_SCOPE,
        callback: () => {},
      });
    }
    return tokenClientRef.current;
  }, [clientId]);

  const requestToken = useCallback((interactive) => {
    return new Promise(async (resolve, reject) => {
      try {
        const tc = await ensureTokenClient();
        tc.callback = (resp) => {
          if (resp.error) reject(new Error(resp.error));
          else {
            accessTokenRef.current = resp.access_token;
            resolve(resp.access_token);
          }
        };
        tc.requestAccessToken({ prompt: interactive ? "consent" : "" });
      } catch (e) {
        reject(e);
      }
    });
  }, [ensureTokenClient]);

  const driveFetch = useCallback(async (url, opts = {}, retry = true) => {
    const token = accessTokenRef.current;
    const res = await fetch(url, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: "Bearer " + token },
    });
    if (res.status === 401 && retry) {
      await requestToken(false);
      return driveFetch(url, opts, false);
    }
    return res;
  }, [requestToken]);

  const findRemoteFile = useCallback(async () => {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await driveFetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name,modifiedTime)`
    );
    if (!res.ok) throw new Error("Không truy vấn được Google Drive.");
    const json = await res.json();
    return json.files && json.files[0] ? json.files[0] : null;
  }, [driveFetch]);

  const downloadRemote = useCallback(async (fileId) => {
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (!res.ok) throw new Error("Không tải được dữ liệu từ Drive.");
    return res.json();
  }, [driveFetch]);

  const createRemoteFile = useCallback(async (payload) => {
    const boundary = "mvboundary" + Date.now();
    const metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(payload)}\r\n--${boundary}--`;
    const res = await driveFetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      { method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body }
    );
    if (!res.ok) throw new Error("Không tạo được file trên Drive.");
    const json = await res.json();
    return json.id;
  }, [driveFetch]);

  const updateRemoteFile = useCallback(async (fileId, payload) => {
    const res = await driveFetch(
      `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
      { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }
    );
    if (!res.ok) throw new Error("Không lưu được dữ liệu lên Drive.");
  }, [driveFetch]);

  const pushToDrive = useCallback(async (payload) => {
    if (!fileIdRef.current) {
      const found = await findRemoteFile();
      if (found) fileIdRef.current = found.id;
      else fileIdRef.current = await createRemoteFile(payload);
      localStorage.setItem(LS_FILE_ID, fileIdRef.current);
      return;
    }
    await updateRemoteFile(fileIdRef.current, payload);
  }, [findRemoteFile, createRemoteFile, updateRemoteFile]);

  const schedulePush = useCallback((payload) => {
    pendingPushRef.current = true;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(async () => {
      if (status === "disconnected" || !accessTokenRef.current) { pendingPushRef.current = false; return; }
      if (!navigator.onLine) { setStatus("offline"); return; }
      setStatus("syncing");
      try {
        await pushToDrive(payload);
        pendingPushRef.current = false;
        setStatus("synced");
        setLastSyncedAt(new Date());
      } catch (e) {
        setErrorMsg(e.message || "Lỗi đồng bộ");
        setStatus(navigator.onLine ? "error" : "offline");
      }
    }, 1500);
  }, [pushToDrive, status]);

  const connect = useCallback(async (interactive = true) => {
    setStatus("connecting");
    setErrorMsg("");
    try {
      await requestToken(interactive);
      const found = await findRemoteFile();
      const local = dataRef.current;
      const localUpdatedAt = local && local._meta ? local._meta.updatedAt : null;

      if (found) {
        fileIdRef.current = found.id;
        localStorage.setItem(LS_FILE_ID, found.id);
        const remote = await downloadRemote(found.id);
        const remoteUpdatedAt = remote && remote._meta ? remote._meta.updatedAt : found.modifiedTime;
        const localHasRealData = local && local.projects && local.projects.length > 0;
        const remoteHasRealData = remote && remote.projects && remote.projects.length > 0;

        if (!remoteHasRealData) {
          await pushToDrive(local);
        } else if (!localHasRealData) {
          applyRemoteData(remote);
        } else if (localUpdatedAt && remoteUpdatedAt && new Date(localUpdatedAt).getTime() === new Date(remoteUpdatedAt).getTime()) {
          // already in sync
        } else {
          setConflict({ local, remote });
          setStatus("conflict");
          localStorage.setItem(LS_CONNECTED, "1");
          return;
        }
      } else {
        await pushToDrive(local);
      }
      localStorage.setItem(LS_CONNECTED, "1");
      setStatus("synced");
      setLastSyncedAt(new Date());
    } catch (e) {
      setErrorMsg(e.message || "Không kết nối được Google Drive");
      setStatus("error");
    }
  }, [requestToken, findRemoteFile, downloadRemote, pushToDrive, applyRemoteData, dataRef]);

  const resolveConflict = useCallback(async (choice) => {
    if (!conflict) return;
    setStatus("syncing");
    try {
      if (choice === "remote") {
        applyRemoteData(conflict.remote);
      } else {
        await pushToDrive(conflict.local);
      }
      setConflict(null);
      setStatus("synced");
      setLastSyncedAt(new Date());
    } catch (e) {
      setErrorMsg(e.message || "Lỗi đồng bộ");
      setStatus("error");
    }
  }, [conflict, applyRemoteData, pushToDrive]);

  const disconnect = useCallback(() => {
    localStorage.removeItem(LS_CONNECTED);
    localStorage.removeItem(LS_FILE_ID);
    fileIdRef.current = "";
    accessTokenRef.current = "";
    setStatus("disconnected");
    setLastSyncedAt(null);
  }, []);

  // Auto reconnect silently if previously connected.
  useEffect(() => {
    if (clientId && localStorage.getItem(LS_CONNECTED) === "1" && status === "disconnected") {
      connect(false).catch(() => {});
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [clientId]);

  // Retry pending push when connectivity returns.
  useEffect(() => {
    const onOnline = () => {
      if (pendingPushRef.current && dataRef.current) schedulePush(dataRef.current);
    };
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, [schedulePush, dataRef]);

  return { clientId, saveClientId, status, lastSyncedAt, errorMsg, conflict, connect, disconnect, resolveConflict, schedulePush };
}

/* ------------------------------- app data hook -------------------------------- */

function useAppData() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const saveTimer = useRef(null);
  const dataRef = useRef(null);

  const applyRemoteData = useCallback((remote) => {
    dataRef.current = remote;
    setData(remote);
    window.storage.set(STORAGE_KEY, JSON.stringify(remote), false).catch(() => {});
  }, []);

  const drive = useDriveSync(dataRef, applyRemoteData);
  const driveRef = useRef(null);
  driveRef.current = drive;

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        let initial;
        if (res && res.value) {
          initial = JSON.parse(res.value);
        } else {
          initial = seedData();
          initial._meta = { updatedAt: new Date().toISOString() };
          await window.storage.set(STORAGE_KEY, JSON.stringify(initial), false);
        }
        dataRef.current = initial;
        setData(initial);
      } catch (e) {
        const seed = seedData();
        seed._meta = { updatedAt: new Date().toISOString() };
        dataRef.current = seed;
        setData(seed);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const persist = useCallback((next) => {
    next._meta = { updatedAt: new Date().toISOString() };
    dataRef.current = next;
    setData(next);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const result = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
        if (!result) setSaveError(true);
        else setSaveError(false);
      } catch (e) {
        setSaveError(true);
      }
    }, 250);
    if (driveRef.current) driveRef.current.schedulePush(next);
  }, []);

  const resetToSample = useCallback(async () => {
    const seed = seedData();
    seed._meta = { updatedAt: new Date().toISOString() };
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(seed), false);
    } catch (e) {}
    dataRef.current = seed;
    setData(seed);
    if (driveRef.current) driveRef.current.schedulePush(seed);
  }, []);

  const clearAll = useCallback(async () => {
    const empty = { projects: [], contracts: [], milestones: [], personnel: [], assignments: [], transactions: [], _meta: { updatedAt: new Date().toISOString() } };
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(empty), false);
    } catch (e) {}
    dataRef.current = empty;
    setData(empty);
  }, []);

  return { data, loading, saveError, persist, resetToSample, clearAll, drive };
}

function Badge({ status }) {
  const meta = STATUS_META[status] || { color: "#9C948A", icon: Circle };
  const Icon = meta.icon;
  return (
    <span className="mv-badge" style={{ "--badge-color": meta.color }}>
      <Icon size={12} strokeWidth={2.5} />
      {status}
    </span>
  );
}

    <div className="mv-stat">

function Dashboard({ data, openProject }) {
  const { projects, transactions, milestones } = data;
  const active = projects.filter((p) => !["Hoàn thành", "Tạm dừng"].includes(p.status));
  const totalThu = transactions.filter((t) => t.type === "Thu").reduce((s, t) => s + t.amount, 0);
  const totalChi = transactions.filter((t) => t.type === "Chi").reduce((s, t) => s + t.amount, 0);
  const upcoming = milestones
    .filter((m) => m.status !== "Hoàn thành")
    .sort((a, b) => new Date(a.date) - new Date(b.date))
    .slice(0, 6);

  return (
    <div>
      <div className="mv-stats-row">
        <StatCard label="Tổng số dự án" value={projects.length} />
        <StatCard label="Đang triển khai" value={active.length} tone="#D4A537" />
        <StatCard label="Tổng doanh thu" value={fmtVND(totalThu)} tone="#5FB77E" />
        <StatCard label="Tổng chi phí" value={fmtVND(totalChi)} tone="#C1443C" />
      </div>

      <div className="mv-dash-grid">
        <div className="mv-panel">
          <h3 className="mv-panel-title"><Film size={16} /> Dự án đang hoạt động</h3>
          {active.length === 0 && <p className="mv-empty-note">Chưa có dự án nào đang hoạt động.</p>}
          {active.map((p) => (
            <div key={p.id} className="mv-mini-row" onClick={() => openProject(p.id)}>
              <div className="mv-mini-row-main">
                <span className="mv-mini-name">{p.name}</span>
                <Badge status={p.status} />
              </div>
              <ProgressBar value={p.progress} />
            </div>
          ))}
        </div>

        <div className="mv-panel">
          <h3 className="mv-panel-title"><Calendar size={16} /> Mốc tiến độ sắp tới</h3>
          {upcoming.length === 0 && <p className="mv-empty-note">Không có mốc tiến độ nào sắp tới.</p>}
          {upcoming.map((m) => {
            const proj = projects.find((p) => p.id === m.projectId);
            return (
              <div key={m.id} className="mv-mini-row" onClick={() => proj && openProject(proj.id)}>
                <div className="mv-mini-row-main">
                  <span className="mv-mini-name">{m.name}</span>
                  <span className="mv-mono-date">{fmtDate(m.date)}</span>
                </div>
                <div className="mv-mini-sub">{proj?.name || "—"} <Badge status={m.status} /></div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ProjectsList({ data, persist, openProject }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("Tất cả");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const filtered = data.projects.filter((p) => {
    const matchesQuery = (p.name + p.client + p.director).toLowerCase().includes(query.toLowerCase());
    const matchesStatus = statusFilter === "Tất cả" || p.status === statusFilter;
    return matchesQuery && matchesStatus;
  });

  const saveProject = (proj) => {
    const next = { ...data };
    if (proj.id) {
      next.projects = data.projects.map((p) => (p.id === proj.id ? proj : p));
    } else {
      next.projects = [...data.projects, { ...proj, id: uid() }];
    }
    persist(next);
    setShowForm(false);
    setEditing(null);
  };

  const deleteProject = (id) => {
    const next = {
      ...data,
      projects: data.projects.filter((p) => p.id !== id),
      contracts: data.contracts.filter((c) => c.projectId !== id),
      milestones: data.milestones.filter((m) => m.projectId !== id),
      assignments: data.assignments.filter((a) => a.projectId !== id),
      transactions: data.transactions.filter((t) => t.projectId !== id),
    };
    persist(next);
    setConfirmDelete(null);
  };

  return (
    <div>
      <div className="mv-toolbar">
        <div className="mv-search">
          <Search size={16} />
          <input placeholder="Tìm dự án, khách hàng, đạo diễn..." value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
        <select className="mv-input mv-filter" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
          <option>Tất cả</option>
          {PROJECT_STATUSES.map((s) => <option key={s}>{s}</option>)}
        </select>
        <button className="mv-btn mv-btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}>
          <Plus size={16} /> Dự án mới
        </button>
      </div>

      {filtered.length === 0 && <p className="mv-empty-note">Không tìm thấy dự án nào.</p>}

      <div className="mv-slate-grid">
        {filtered.map((p) => (
          <div key={p.id}>
            {confirmDelete === p.id ? (
              <div className="mv-slate mv-slate-confirm">
                <ConfirmBar text={`Xoá dự án "${p.name}"? Toàn bộ hợp đồng, timeline, nhân sự, dòng tiền liên quan cũng sẽ bị xoá.`} onConfirm={() => deleteProject(p.id)} onCancel={() => setConfirmDelete(null)} />
              </div>
            ) : (
              <ProjectSlateCard
                p={p}
                onOpen={() => openProject(p.id)}
                onEdit={() => { setEditing(p); setShowForm(true); }}
                onDelete={() => setConfirmDelete(p.id)}
              />
            )}
          </div>
        ))}
      </div>

      {showForm && (
        <ProjectForm
          initial={editing}
          onClose={() => { setShowForm(false); setEditing(null); }}
          onSave={saveProject}
        />
      )}
    </div>
  );
}

  const transactions = data.transactions.filter((t) => t.projectId === projectId).sort((a, b) => new Date(b.date) - new Date(a.date));

  const thu = transactions.filter((t) => t.type === "Thu").reduce((s, t) => s + t.amount, 0);
  const chi = transactions.filter((t) => t.type === "Chi").reduce((s, t) => s + t.amount, 0);

  const patchProject = (patch) => persist({ ...data, projects: data.projects.map((p) => (p.id === projectId ? { ...p, ...patch } : p)) });

  const saveContract = (c) => {
    const next = { ...data };
    next.contracts = c.id
      ? data.contracts.map((x) => (x.id === c.id ? c : x))
      : [...data.contracts, { ...c, id: uid(), projectId }];

    setShowContractForm(false);
    setEditingContract(null);

  const deleteContract = (id) => { persist({ ...data, contracts: data.contracts.filter((c) => c.id !== id) }); setConfirmRemove(null); };

  const saveMilestone = (m) => {

      : [...data.transactions, { ...t, id: uid(), projectId }];

    setShowTxnForm(false);
    setEditingTxn(null);

  const assignedPersonnel = assignments.map((a) => ({ ...a, person: data.personnel.find((p) => p.id === a.personnelId) }));

/* --------------------------------- personnel page ------------------------------ */

function PersonnelPage({ data, persist }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [query, setQuery] = useState("");

  const save = (p) => {
    const next = { ...data };
    next.personnel = p.id ? data.personnel.map((x) => (x.id === p.id ? p : x)) : [...data.personnel, { ...p, id: uid() }];
    persist(next);
    setShowForm(false);
    setEditing(null);
  };

  const del = (id) => {
    persist({
      ...data,
      personnel: data.personnel.filter((p) => p.id !== id),
      assignments: data.assignments.filter((a) => a.personnelId !== id),
    });
    setConfirmDelete(null);
  };

  const filtered = data.personnel.filter((p) => (p.name + p.role).toLowerCase().includes(query.toLowerCase()));

  const projectCount = (personnelId) => data.assignments.filter((a) => a.personnelId === personnelId).length;

  return (
    <div>
      <div className="mv-toolbar">
        <div className="mv-search">
          <Search size={16} />
          <input placeholder="Tìm nhân sự theo tên hoặc vai trò..." value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
        <button className="mv-btn mv-btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}><Plus size={16} /> Thêm nhân sự</button>
      </div>

      {filtered.length === 0 && <p className="mv-empty-note">Chưa có nhân sự nào.</p>}

      <div className="mv-crew-grid">
        {filtered.map((p) => (
          confirmDelete === p.id ? (
            <div key={p.id} className="mv-panel"><ConfirmBar text={`Xoá nhân sự "${p.name}"? Nhân sự sẽ được gỡ khỏi mọi dự án.`} onConfirm={() => del(p.id)} onCancel={() => setConfirmDelete(null)} /></div>
          ) : (
            <div key={p.id} className="mv-crew-card">
              <div className="mv-crew-avatar">{p.name.split(" ").slice(-1)[0]?.[0] || "?"}</div>
              <div className="mv-crew-info">
                <div className="mv-row-title">{p.name}</div>
                <div className="mv-row-sub">{p.role}</div>
                <div className="mv-crew-contact">
                  {p.phone && <span><Phone size={12} /> {p.phone}</span>}
                  {p.email && <span><Mail size={12} /> {p.email}</span>}
                </div>
                <div className="mv-row-sub">Đơn giá: <span className="mv-mono-money">{fmtVND(p.dayRate)}</span>/ngày · {projectCount(p.id)} dự án</div>
              </div>
              <div className="mv-row-right mv-crew-actions">
                <button className="mv-icon-btn" onClick={() => { setEditing(p); setShowForm(true); }}><Pencil size={14} /></button>
                <button className="mv-icon-btn" onClick={() => setConfirmDelete(p.id)}><Trash2 size={14} /></button>
              </div>
            </div>
          )
        ))}
      </div>

      {showForm && <PersonnelForm initial={editing} onClose={() => { setShowForm(false); setEditing(null); }} onSave={save} />}
    </div>
  );
}

/* ------------------------------ drive settings UI ------------------------------ */

function DriveStatusLine({ status, lastSyncedAt, errorMsg }) {
  const map = {
    disconnected: { icon: CloudOff, text: "Chưa kết nối Google Drive", color: "var(--text-muted)" },
    connecting: { icon: RefreshCw, text: "Đang kết nối...", color: "var(--gold)", spin: true },
    syncing: { icon: RefreshCw, text: "Đang đồng bộ...", color: "var(--gold)", spin: true },
    synced: { icon: Cloud, text: lastSyncedAt ? `Đã đồng bộ lúc ${lastSyncedAt.toLocaleTimeString("vi-VN")}` : "Đã đồng bộ", color: "var(--green)" },
    offline: { icon: WifiOff, text: "Mất mạng — sẽ tự đồng bộ khi có mạng", color: "var(--gold)" },
    error: { icon: CloudOff, text: errorMsg || "Lỗi đồng bộ", color: "var(--red)" },
    conflict: { icon: AlertCircle, text: "Dữ liệu khác nhau giữa máy và Drive", color: "var(--red)" },
  };
  const m = map[status] || map.disconnected;
  const Ic = m.icon;
  return (
    <div className="mv-drive-status" style={{ color: m.color }}>
      <Ic size={13} className={m.spin ? "mv-spin" : ""} />
      <span>{m.text}</span>
    </div>
  );
}

function DriveSettingsModal({ drive, onClose }) {
  const [idInput, setIdInput] = useState(drive.clientId);
  const hasId = !!drive.clientId;
  const isConnected = drive.status !== "disconnected" && drive.status !== "error" && hasId;

  return (
    <Modal title="Đồng bộ Google Drive" onClose={onClose} wide>
      <p className="mv-drive-intro">
        Dữ liệu công ty sẽ được lưu vào một file riêng trong Google Drive của bạn
        (chỉ app này truy cập được file đó, không đụng tới các file khác trong Drive).
        App vẫn hoạt động khi mất mạng — dữ liệu tự đồng bộ lại khi có mạng.
      </p>

      <Field label="Google OAuth Client ID">
        <input
          className="mv-input"
          placeholder="xxxxxxxx.apps.googleusercontent.com"
          value={idInput}
          onChange={(e) => setIdInput(e.target.value)}
        />
      </Field>
      <button
        className="mv-btn mv-btn-ghost mv-btn-sm"
        style={{ marginBottom: 14 }}
        onClick={() => drive.saveClientId(idInput)}
        disabled={!idInput.trim()}
      >
        Lưu Client ID
      </button>

      <div className="mv-drive-divider" />

      <DriveStatusLine status={drive.status} lastSyncedAt={drive.lastSyncedAt} errorMsg={drive.errorMsg} />

      <div className="mv-modal-actions" style={{ justifyContent: "flex-start", marginTop: 14 }}>
        {!isConnected ? (
          <button className="mv-btn mv-btn-primary" disabled={!hasId} onClick={() => drive.connect(true)}>
            <Cloud size={15} /> Kết nối Google Drive
          </button>
        ) : (
          <button className="mv-btn mv-btn-ghost" onClick={drive.disconnect}>
            <Unlink size={15} /> Ngắt kết nối
          </button>
        )}
      </div>

      <p className="mv-drive-hint">
        Chưa có Client ID? Làm theo hướng dẫn "Thiết lập Google Drive" đi kèm để lấy trong vài phút.
      </p>
    </Modal>
  );
}

function DriveConflictModal({ conflict, onResolve }) {
  const localCount = conflict.local?.projects?.length || 0;
  const remoteCount = conflict.remote?.projects?.length || 0;
  const localTime = conflict.local?._meta?.updatedAt ? new Date(conflict.local._meta.updatedAt).toLocaleString("vi-VN") : "không rõ";
  const remoteTime = conflict.remote?._meta?.updatedAt ? new Date(conflict.remote._meta.updatedAt).toLocaleString("vi-VN") : "không rõ";
  return (
    <Modal title="Dữ liệu không khớp" onClose={() => {}}>
      <p className="mv-drive-intro">
        Dữ liệu trên máy này khác với dữ liệu đang lưu trên Google Drive. Chọn bản bạn muốn giữ
        (bản còn lại sẽ bị ghi đè).
      </p>
      <div className="mv-conflict-grid">
        <div className="mv-conflict-card">
          <div className="mv-detail-label">Trên máy này</div>
          <div className="mv-detail-value">{localCount} dự án</div>
          <div className="mv-row-sub mv-mono-date">Cập nhật {localTime}</div>
          <button className="mv-btn mv-btn-primary mv-btn-sm" style={{ marginTop: 10 }} onClick={() => onResolve("local")}>Dùng bản này</button>
        </div>
        <div className="mv-conflict-card">
          <div className="mv-detail-label">Trên Google Drive</div>
          <div className="mv-detail-value">{remoteCount} dự án</div>
          <div className="mv-row-sub mv-mono-date">Cập nhật {remoteTime}</div>
          <button className="mv-btn mv-btn-primary mv-btn-sm" style={{ marginTop: 10 }} onClick={() => onResolve("remote")}>Dùng bản này</button>
        </div>
      </div>
    </Modal>
  );
}

/* ----------------------------------- shell ------------------------------------ */

function App() {
  const { data, loading, saveError, persist, resetToSample, clearAll, drive } = useAppData();
  const [view, setView] = useState("dashboard");
  const [activeProjectId, setActiveProjectId] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [showDriveModal, setShowDriveModal] = useState(false);

  const openProject = (id) => { setActiveProjectId(id); setView("project"); };

  const NAV = [
    { id: "dashboard", label: "Tổng quan", icon: LayoutDashboard },
    { id: "projects", label: "Dự án", icon: Film },
    { id: "personnel", label: "Nhân sự", icon: Users },
  ];

  return (
    <div className="mv-app">
      <style>{CSS}</style>
      <div className="mv-shell">
        <aside className="mv-sidebar">
          <div className="mv-brand">
            <div className="mv-brand-mark">
              <div className="mv-brand-stripe" /><div className="mv-brand-stripe" /><div className="mv-brand-stripe" />
            </div>
            <div>
              <div className="mv-brand-title">STUDIO SLATE</div>
              <div className="mv-brand-sub">Quản lý sản xuất MV</div>
            </div>
          </div>
          <nav className="mv-nav">
            {NAV.map((n) => (
              <button
                key={n.id}
                className={`mv-nav-item ${view === n.id || (n.id === "projects" && view === "project") ? "mv-nav-active" : ""}`}
                onClick={() => { setView(n.id); setActiveProjectId(null); }}
              >
                <n.icon size={17} /> {n.label}
              </button>
            ))}
          </nav>
          <div className="mv-sidebar-footer">
            {saveError && <div className="mv-save-error">Lưu dữ liệu thất bại. Thay đổi có thể chưa được lưu.</div>}

            <button className="mv-drive-trigger" onClick={() => setShowDriveModal(true)}>
              <DriveStatusLine status={drive.status} lastSyncedAt={drive.lastSyncedAt} errorMsg={drive.errorMsg} />
              <Settings size={13} />
            </button>

            {confirmReset ? (
              <div className="mv-reset-confirm">
                <span>Khôi phục dữ liệu mẫu? Toàn bộ dữ liệu hiện tại sẽ mất.</span>
                <div>
                  <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => setConfirmReset(false)}>Huỷ</button>
                  <button className="mv-btn mv-btn-danger mv-btn-sm" onClick={() => { resetToSample(); setConfirmReset(false); }}>Khôi phục</button>
                </div>
              </div>
            ) : (
              <button className="mv-reset-link" onClick={() => setConfirmReset(true)}>Khôi phục dữ liệu mẫu</button>
            )}
          </div>
        </aside>

        <main className="mv-main">
          {loading || !data ? (
            <div className="mv-loading"><Loader2 className="mv-spin" size={22} /> Đang tải dữ liệu...</div>
          ) : (
            <>
              {view === "dashboard" && <Dashboard data={data} openProject={openProject} />}
              {view === "projects" && <ProjectsList data={data} persist={persist} openProject={openProject} />}
              {view === "project" && <ProjectDetail data={data} persist={persist} projectId={activeProjectId} back={() => setView("projects")} />}
              {view === "personnel" && <PersonnelPage data={data} persist={persist} />}
            </>
          )}
        </main>
      </div>

      {showDriveModal && <DriveSettingsModal drive={drive} onClose={() => setShowDriveModal(false)} />}
      {drive.conflict && <DriveConflictModal conflict={drive.conflict} onResolve={drive.resolveConflict} />}
    </div>
  );
}

  cursor: pointer; text-align: left; font-family: inherit;
}
.mv-nav-item:hover { background: var(--surface-2); color: var(--text); }
.mv-nav-active { background: var(--surface-2); color: var(--gold); }
.mv-sidebar-footer { display: flex; flex-direction: column; gap: 8px; }
.mv-reset-link { background: none; border: none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; text-decoration: underline; text-align: left; padding: 0; }
.mv-reset-confirm { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11.5px; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px; }
.mv-save-error { font-size: 11px; color: var(--red); }

.mv-main { flex: 1; padding: 26px 30px; overflow-y: auto; max-height: 90vh; }
.mv-loading { display: flex; align-items: center; gap: 10px; color: var(--text-muted); padding: 60px 0; justify-content: center; }
.mv-spin { animation: mv-spin 1s linear infinite; }
@keyframes mv-spin { to { transform: rotate(360deg); } }

.mv-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.mv-stats-row-sm { grid-template-columns: repeat(3, 1fr); margin-bottom: 16px; }
.mv-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.mv-stat-label { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.mv-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; }
.mv-stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.mv-dash-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.mv-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.mv-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.mv-panel-title { display: flex; align-items: center; gap: 8px; font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text); margin: 0 0 14px 0; }
.mv-panel-head .mv-panel-title { margin-bottom: 0; }

.mv-mini-row { padding: 10px 8px; border-radius: 8px; cursor: pointer; border-bottom: 1px solid var(--border); }
.mv-mini-row:last-child { border-bottom: none; }
.mv-mini-row:hover { background: var(--surface-2); }
.mv-mini-row-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.mv-mini-name { font-size: 13.5px; font-weight: 500; }
.mv-mini-sub { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.mv-progress { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.mv-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--teal)); border-radius: 3px; transition: width 0.3s; }

.mv-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 20px; background: color-mix(in srgb, var(--badge-color) 16%, transparent);
  color: var(--badge-color); white-space: nowrap;
}

.mv-toolbar { display: flex; gap: 10px; margin-bottom: 18px; align-items: center; }
.mv-search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; flex: 1; color: var(--text-muted); }
.mv-search input { background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; width: 100%; font-family: inherit; }
.mv-filter { width: 170px; }

.mv-input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 7px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; outline: none;
}
.mv-input:focus { border-color: var(--gold); }

.mv-btn {
  display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px;
  padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.mv-btn-sm { padding: 6px 10px; font-size: 12px; }
.mv-btn-primary { background: var(--gold); color: #1D1A16; }
.mv-btn-primary:hover { filter: brightness(1.08); }
.mv-btn-ghost { background: none; color: var(--text-muted); border: 1px solid var(--border); }
.mv-btn-ghost:hover { color: var(--text); }
.mv-btn-danger { background: var(--red); color: #fff; }

.mv-icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 6px; display: inline-flex; }
.mv-icon-btn:hover { background: var(--surface-2); color: var(--text); }
.mv-icon-btn-light { color: rgba(255,255,255,0.75); }
.mv-icon-btn-light:hover { background: rgba(255,255,255,0.12); color: #fff; }

.mv-empty-note { color: var(--text-muted); font-size: 13px; padding: 10px 2px; }

.mv-slate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.mv-slate { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.mv-slate-confirm { padding: 14px; }
.mv-slate-clap { height: 26px; background: repeating-linear-gradient(-45deg, #0F0D0B, #0F0D0B 10px, var(--gold) 10px, var(--gold) 20px); position: relative; display: flex; justify-content: flex-end; align-items: center; padding: 0 6px; }
.mv-slate-clap-actions { display: flex; gap: 2px; background: rgba(0,0,0,0.35); border-radius: 6px; padding: 1px; }
.mv-slate-body { padding: 16px; cursor: pointer; }
.mv-slate-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; margin-bottom: 6px; gap: 10px; }
.mv-slate-row span { color: var(--text-muted); font-size: 10.5px; letter-spacing: 0.06em; }
.mv-slate-row strong { font-weight: 600; text-align: right; }
.mv-slate-footer { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 8px; }
.mv-slate-open { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 12px; color: var(--gold); margin-top: 10px; font-weight: 600; }

.mv-mono-date, .mv-mono-money { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.mv-mono-money { color: var(--text); font-weight: 600; }

.mv-back { background: none; border: none; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; margin-bottom: 16px; padding: 0; font-family: inherit; }
.mv-back:hover { color: var(--text); }

.mv-project-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.mv-eyebrow { font-size: 10.5px; letter-spacing: 0.1em; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
.mv-project-head h2 { font-family: 'Oswald', sans-serif; font-size: 24px; margin: 0 0 4px; font-weight: 600; }
.mv-project-sub { color: var(--text-muted); font-size: 13px; }

.mv-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.mv-tab { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-muted); padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
.mv-tab:hover { color: var(--text); }
.mv-tab-active { color: var(--gold); border-bottom-color: var(--gold); }

.mv-overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.mv-detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.mv-detail-value { font-size: 15px; font-weight: 600; }
.mv-overview-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.mv-overview-progress .mv-progress { flex: 1; }
.mv-inline-progress-edit input { width: 100%; accent-color: var(--gold); }
.mv-desc { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin: 4px 0 0; }

.mv-row-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.mv-row-card:last-child { border-bottom: none; }
.mv-row-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.mv-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.mv-row-right { display: flex; align-items: center; gap: 8px; }
.mv-row-txn-icon { display: flex; }

.mv-filmstrip { position: relative; padding-left: 4px; }
.mv-milestone { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px dashed var(--border); }
.mv-milestone:last-child { border-bottom: none; }
.mv-milestone-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.mv-milestone-body { flex: 1; }

.mv-crew-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.mv-crew-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
.mv-crew-avatar { width: 40px; height: 40px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Oswald', sans-serif; flex-shrink: 0; }
.mv-crew-info { flex: 1; }
.mv-crew-contact { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--text-muted); margin: 6px 0; }
.mv-crew-contact span { display: flex; align-items: center; gap: 5px; }
.mv-crew-actions { flex-direction: column; }

.mv-modal-overlay { position: fixed; inset: 0; background: rgba(10,9,7,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.mv-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 420px; max-width: 100%; max-height: 85vh; overflow-y: auto; }
.mv-modal-wide { width: 560px; }
.mv-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.mv-modal-head h3 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; }
.mv-modal-body { padding: 18px; }
.mv-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.mv-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.mv-field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

.mv-confirm { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: color-mix(in srgb, var(--red) 12%, var(--surface)); border: 1px solid var(--red); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.mv-confirm > span { flex: 1; }

@media (max-width: 860px) {
  .mv-shell { flex-direction: column; }
  .mv-sidebar { width: 100%; flex-direction: row; align-items: center; }
  .mv-nav { flex-direction: row; }
  .mv-sidebar-footer { display: none; }
  .mv-dash-grid, .mv-overview-grid, .mv-form-grid { grid-template-columns: 1fr; }
  .mv-stats-row { grid-template-columns: repeat(2, 1fr); }
}
