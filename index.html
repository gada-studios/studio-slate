  const [showAddForm, setShowAddForm] = useState(false);
  const [newName, setNewName] = useState("");
  const [newGroup, setNewGroup] = useState(CATALOG_GROUPS[0]);

  const grouped = CATALOG_GROUPS.map((g) => ({ group: g, items: catalog.filter((c) => c.group === g) })).filter((g) => g.items.length > 0);

  const handleDragStart = (e, item) => {
    e.dataTransfer.setData("text/plain", JSON.stringify({ name: item.name, group: item.group }));
    e.dataTransfer.effectAllowed = "copy";
  };

  return (
    <div className="mv-catalog">
      <div className="mv-catalog-hint">Kéo (hoặc bấm) một hạng mục bên dưới vào dự án để thêm nhanh:</div>
      {grouped.map(({ group, items }) => (
        <div key={group} className="mv-catalog-group">
          <div className="mv-catalog-group-label">{group}</div>
          <div className="mv-catalog-chips">
            {items.map((item) => (
              <button
                key={item.id}
                className="mv-catalog-chip"
                draggable
                onDragStart={(e) => handleDragStart(e, item)}
                onClick={() => onPick(item)}
              >
                {item.name}
              </button>
            ))}
          </div>
        </div>
      ))}

      {showAddForm ? (
        <div className="mv-catalog-add-form">
          <input className="mv-input" placeholder="Tên hạng mục mới" value={newName} onChange={(e) => setNewName(e.target.value)} />
          <select className="mv-input" value={newGroup} onChange={(e) => setNewGroup(e.target.value)}>
            {CATALOG_GROUPS.map((g) => <option key={g}>{g}</option>)}
          </select>
          <button
            className="mv-btn mv-btn-primary mv-btn-sm"
            onClick={() => { if (newName.trim()) { onPick({ group: newGroup, name: newName.trim() }); setNewName(""); setShowAddForm(false); } }}
          >
            Thêm
          </button>
          <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => setShowAddForm(false)}>Huỷ</button>
        </div>
      ) : (
        <button className="mv-catalog-add-trigger" onClick={() => setShowAddForm(true)}><Plus size={13} /> Hạng mục khác (chỉ thêm lần này, không lưu vào danh mục)</button>
      )}
    </div>
  );
}

function ProjectDetail({ data, persist, projectId, back }) {
  const project = data.projects.find((p) => p.id === projectId);
  const [tab, setTab] = useState("overview");
  const [timelineView, setTimelineView] = useState("list");
  const [showContractForm, setShowContractForm] = useState(false);
  const [editingContract, setEditingContract] = useState(null);
  const [showLineItemForm, setShowLineItemForm] = useState(false);
  const [editingLineItem, setEditingLineItem] = useState(null);
  const [showMilestoneForm, setShowMilestoneForm] = useState(false);
  const [editingMilestone, setEditingMilestone] = useState(null);
  const [confirmRemove, setConfirmRemove] = useState(null);

  if (!project) {
    return (
      <div>
        <button className="mv-back" onClick={back}><ArrowLeft size={16} /> Quay lại</button>
        <p className="mv-empty-note">Dự án không tồn tại (có thể đã bị xoá).</p>
      </div>
    );
  }

  const contracts = data.contracts.filter((c) => c.projectId === projectId);
  const lineItems = data.lineItems.filter((l) => l.projectId === projectId);
  const milestones = data.milestones.filter((m) => m.projectId === projectId).sort((a, b) => new Date(a.date) - new Date(b.date));
  const crewLineItems = lineItems.filter((l) => l.group === "Nhân sự" && l.personnelId);
  const transactions = data.transactions.filter((t) => t.projectId === projectId).sort((a, b) => new Date(b.date) - new Date(a.date));

  const thu = transactions.filter((t) => t.type === "Thu").reduce((s, t) => s + t.amount, 0);
  const chi = transactions.filter((t) => t.type === "Chi").reduce((s, t) => s + t.amount, 0);
  const lineItemsActual = lineItems.reduce((s, l) => s + l.actualValue, 0);
  const lineItemsDebt = lineItems.reduce((s, l) => s + (l.actualValue - (l.paidAmount || 0)), 0);
  const lineItemsSubtotal = lineItems.reduce((s, l) => s + l.contractValue, 0);
  const lineItemsExtraTotal = lineItems.reduce((s, l) => s + (l.extraAmount || 0), 0);
  const clientTotal = lineItemsSubtotal + lineItemsExtraTotal;
  const clientReceived = contracts.reduce((s, c) => s + (c.receivedAmount || 0), 0);
  const clientDebtTotal = clientTotal - clientReceived;
  const profit = clientTotal - lineItemsActual;

  const patchProject = (patch) => persist({ ...data, projects: data.projects.map((p) => (p.id === projectId ? { ...p, ...patch } : p)) });

  const saveContract = (c) => {
    const next = { ...data };
    next.contracts = c.id
      ? data.contracts.map((x) => (x.id === c.id ? c : x))
      : [...data.contracts, { ...c, id: uid(), projectId }];
    persist(next);
    setShowContractForm(false);
    setEditingContract(null);
  };
  const deleteContract = (id) => { persist({ ...data, contracts: data.contracts.filter((c) => c.id !== id) }); setConfirmRemove(null); };

  const saveLineItem = (l) => {
    const next = { ...data };
    next.lineItems = l.id
      ? data.lineItems.map((x) => (x.id === l.id ? l : x))
      : [...data.lineItems, { ...l, id: uid(), projectId }];
    persist(next);
    setShowLineItemForm(false);
    setEditingLineItem(null);
  };
  const deleteLineItem = (id) => { persist({ ...data, lineItems: data.lineItems.filter((l) => l.id !== id) }); setConfirmRemove(null); };
  const markLineItemPaid = (id, actualValue) => {
    persist({ ...data, lineItems: data.lineItems.map((l) => (l.id === id ? { ...l, paidAmount: actualValue } : l)) });
  };
  const quickAddFromCatalog = (item) => {
    setEditingLineItem({ name: item.name, group: item.group || CATALOG_GROUPS[0], quantity: 1, unitPrice: "", contractValue: "", extraAmount: "", paidAmount: "", notes: "" });
    setShowLineItemForm(true);
  };
  const handleCatalogDrop = (e) => {
    e.preventDefault();
    try {
      const parsed = JSON.parse(e.dataTransfer.getData("text/plain"));
      if (parsed && parsed.name) quickAddFromCatalog(parsed);
    } catch (err) {}
  };
  const quickAddPersonnel = (personData) => {
    const newPerson = { ...personData, id: uid() };
    persist({ ...data, personnel: [...data.personnel, newPerson] });
    return newPerson;
  };

  const saveMilestone = (m) => {
    const next = { ...data };
    next.milestones = m.id
      ? data.milestones.map((x) => (x.id === m.id ? m : x))
      : [...data.milestones, { ...m, id: uid(), projectId }];
    persist(next);
    setShowMilestoneForm(false);
    setEditingMilestone(null);
  };
  const deleteMilestone = (id) => { persist({ ...data, milestones: data.milestones.filter((m) => m.id !== id) }); setConfirmRemove(null); };
  const addMilestoneOnDate = (dateKey, name) => {
    persist({ ...data, milestones: [...data.milestones, { id: uid(), projectId, name, date: dateKey, status: "Chưa bắt đầu" }] });
  };
  const moveMilestoneToDate = (id, dateKey) => {
    persist({ ...data, milestones: data.milestones.map((m) => (m.id === id ? { ...m, date: dateKey } : m)) });
  };
  const addTimelineCatalogItem = ({ group, name }) => {
    persist({ ...data, timelineCatalog: [...data.timelineCatalog, { id: uid(), group, name }] });
  };

  const crewList = crewLineItems.map((l) => ({ ...l, person: data.personnel.find((p) => p.id === l.personnelId) }));
  const addCrewMember = () => {
    setEditingLineItem({ name: "", group: "Nhân sự", personnelId: "", quantity: 1, unitPrice: "", contractValue: "", extraAmount: "", paidAmount: "", notes: "" });
    setShowLineItemForm(true);
  };

  const handleExportProject = () => {
    const bundle = {
      exportedAt: new Date().toISOString(),
      project,
      contracts,
      milestones,
      assignments: assignedPersonnel.map(({ person, ...a }) => a),
      lineItems,
    };
    const safeName = project.name.replace(/[^a-zA-Z0-9À-ỹ ]/g, "").trim().replace(/\s+/g, "-");
    downloadJSON(bundle, `du-an-${safeName}-${todayISO()}.json`);
  };

  const TABS = [
    { id: "overview", label: "Tổng quan", icon: Film },
    { id: "contract", label: "Dòng tiền", icon: Wallet },
    { id: "timeline", label: "Timeline", icon: Calendar },
    { id: "crew", label: "Nhân sự", icon: Users },
  ];

  return (
    <div>
      <button className="mv-back" onClick={back}><ArrowLeft size={16} /> Danh sách dự án</button>

      <div className="mv-project-head">
        <div>
          <div className="mv-eyebrow">DỰ ÁN MV</div>
          <h2>{project.name}</h2>
          <div className="mv-project-sub">{project.client} · Đạo diễn {project.director || "—"}</div>
        </div>
        <div className="mv-project-head-right">
          <Badge status={project.status} />
          <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={handleExportProject}><FileText size={13} /> Tải sao lưu dự án</button>
        </div>
      </div>

      <div className="mv-tabs">
        {TABS.map((t) => (
          <button key={t.id} className={`mv-tab ${tab === t.id ? "mv-tab-active" : ""}`} onClick={() => setTab(t.id)}>
            <t.icon size={15} /> {t.label}
          </button>
        ))}
      </div>

      {tab === "overview" && (
        <div className="mv-panel">
          <div className="mv-overview-grid">
            <div>
              <div className="mv-detail-label">Tiến độ tổng thể</div>
              <div className="mv-overview-progress">
                <ProgressBar value={project.progress} />
                <span className="mv-mono-date">{project.progress}%</span>
              </div>
              <div className="mv-inline-progress-edit">
                <input
                  type="range" min="0" max="100" value={project.progress}
                  onChange={(e) => patchProject({ progress: Number(e.target.value) })}
                />
              </div>
            </div>
            <div><div className="mv-detail-label">Ngân sách <span className="mv-row-sub">(tự tính từ bảng chi phí, chưa VAT)</span></div><div className="mv-detail-value">{fmtVND(lineItemsSubtotal)}</div></div>
            <div><div className="mv-detail-label">Thời gian</div><div className="mv-detail-value mv-mono-date">{fmtDate(project.startDate)} → {fmtDate(project.endDate)}</div></div>
            <div><div className="mv-detail-label">Thực chi / Còn nợ</div><div className="mv-detail-value"><span style={{ color: "#D4A537" }}>{fmtVND(lineItemsActual)}</span> / <span style={{ color: "#C1443C" }}>{fmtVND(lineItemsDebt)}</span></div></div>
          </div>
          {project.description && (
            <div style={{ marginTop: 16 }}>
              <div className="mv-detail-label">Mô tả</div>
              <p className="mv-desc">{project.description}</p>
            </div>
          )}
        </div>
      )}

      {tab === "contract" && (
        <>
        <div className="mv-panel mv-cashflow-summary">
          <h3 className="mv-panel-title"><Wallet size={16} /> Tổng quan dòng tiền dự án</h3>
          <div className="mv-cashflow-grid">
            <div className="mv-cashflow-stat">
              <div className="mv-detail-label">Khách phải trả</div>
              <div className="mv-cashflow-value" style={{ color: "#3FA9A0" }}>{fmtVND(clientTotal)}</div>
            </div>
            <div className="mv-cashflow-stat">
              <div className="mv-detail-label">Khách còn nợ</div>
              <div className="mv-cashflow-value" style={{ color: clientDebtTotal > 0 ? "#C1443C" : "#5FB77E" }}>{fmtVND(clientDebtTotal)}</div>
            </div>
            <div className="mv-cashflow-stat">
              <div className="mv-detail-label">Tổng thực chi</div>
              <div className="mv-cashflow-value" style={{ color: "#D4A537" }}>{fmtVND(lineItemsActual)}</div>
            </div>
            <div className="mv-cashflow-stat">
              <div className="mv-detail-label">Lợi nhuận (dự kiến)</div>
              <div className="mv-cashflow-value" style={{ color: profit >= 0 ? "#5FB77E" : "#C1443C" }}>{fmtVND(profit)}</div>
            </div>
            <div className="mv-cashflow-stat">
              <div className="mv-detail-label">Công ty còn nợ hạng mục</div>
              <div className="mv-cashflow-value" style={{ color: lineItemsDebt > 0 ? "#C1443C" : "#5FB77E" }}>{fmtVND(lineItemsDebt)}</div>
            </div>
          </div>
        </div>

        <div className="mv-panel">
          <div className="mv-panel-head">
            <h3 className="mv-panel-title"><FileText size={16} /> Hợp đồng</h3>
            <button className="mv-btn mv-btn-primary mv-btn-sm" onClick={() => { setEditingContract(null); setShowContractForm(true); }}><Plus size={14} /> Thêm hợp đồng</button>
          </div>
          {contracts.length === 0 && <p className="mv-empty-note">Chưa có hợp đồng nào cho dự án này.</p>}
          {contracts.map((c) => {
            const clientDebt = c.value - (c.receivedAmount || 0);
            return confirmRemove === c.id ? (
              <ConfirmBar key={c.id} text={`Xoá hợp đồng ${c.contractNumber}?`} onConfirm={() => deleteContract(c.id)} onCancel={() => setConfirmRemove(null)} />
            ) : (
              <div key={c.id} className="mv-row-card mv-row-card-wrap">
                <div>
                  <div className="mv-row-title">{c.contractNumber} <Badge status={c.status} /></div>
                  <div className="mv-row-sub">Ký ngày {fmtDate(c.signedDate)} · {c.paymentTerms || "Chưa có điều khoản thanh toán"}</div>
                  {c.notes && <div className="mv-row-sub">Ghi chú: {c.notes}</div>}
                </div>
                <div className="mv-row-right mv-assignment-pay">
                  <div className="mv-assignment-pay-nums">
                    <span className="mv-mono-money">{fmtVND(c.value)}</span>
                    <span className="mv-row-sub">đã thu {fmtVND(c.receivedAmount || 0)}</span>
                    <span className={clientDebt > 0 ? "mv-debt-badge" : "mv-paid-badge"}>
                      {clientDebt > 0 ? `Khách còn nợ ${fmtVND(clientDebt)}` : "Đã thu đủ"}
                    </span>
                  </div>
                  <div>
                    <button className="mv-icon-btn" onClick={() => { setEditingContract(c); setShowContractForm(true); }}><Pencil size={14} /></button>
                    <button className="mv-icon-btn" onClick={() => setConfirmRemove(c.id)}><Trash2 size={14} /></button>
                  </div>
                </div>
              </div>
            );
          })}
          {showContractForm && <ContractForm initial={editingContract} onClose={() => { setShowContractForm(false); setEditingContract(null); }} onSave={saveContract} />}
        </div>

        <div className="mv-panel">
          <h3 className="mv-panel-title"><Plus size={16} /> Danh mục hạng mục</h3>
          <CatalogPanel catalog={data.catalog} onPick={quickAddFromCatalog} />
        </div>

        <div className="mv-panel" onDragOver={(e) => e.preventDefault()} onDrop={handleCatalogDrop} id="mv-printable-lineitems">
          <div className="mv-panel-head mv-no-print">
            <h3 className="mv-panel-title"><Wallet size={16} /> Bảng dự toán &amp; hạng mục chi phí</h3>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => window.print()}><FileText size={14} /> Tải PDF (gửi khách)</button>
              <button className="mv-btn mv-btn-primary mv-btn-sm" onClick={() => { setEditingLineItem(null); setShowLineItemForm(true); }}><Plus size={14} /> Thêm hạng mục</button>
            </div>
          </div>

          <div className="mv-print-only mv-print-header">
            <img src={LOGO_DATA_URI} alt="Logo" className="mv-print-logo" />
            <div>
              <div className="mv-print-title">QUOTATION — {project.name}</div>
              {project.client && <div className="mv-print-sub">Khách hàng: {project.client}</div>}
            </div>
          </div>

          {lineItems.length === 0 && <p className="mv-empty-note mv-no-print">Chưa có hạng mục nào. Kéo hoặc bấm hạng mục ở danh mục trên để thêm — số liệu này vừa dùng làm bảng dự toán gửi khách, vừa dùng để theo dõi thực chi nội bộ.</p>}

          {lineItems.length > 0 && (() => {
            const subtotal = lineItems.reduce((s, l) => s + l.contractValue, 0);
            const totalExtra = lineItems.reduce((s, l) => s + (l.extraAmount || 0), 0);
            const billableTotal = subtotal + totalExtra;
            const vat = billableTotal * 0.08;
            const totalWithVat = billableTotal + vat;
            const grouped = CATALOG_GROUPS.map((g) => ({ group: g, items: lineItems.filter((l) => (l.group || "Miscellaneous") === g) }))
              .concat([{ group: "Khác", items: lineItems.filter((l) => !CATALOG_GROUPS.includes(l.group)) }])
              .filter((g) => g.items.length > 0);
            return (
              <>
              <div className="mv-stats-row mv-stats-row-sm mv-no-print">
                <StatCard label="Thực chi" value={fmtVND(lineItems.reduce((s, l) => s + l.actualValue, 0))} tone="#D4A537" />
                <StatCard label="Phát sinh" value={fmtVND(totalExtra)} tone={totalExtra > 0 ? "#C1443C" : undefined} />
                <StatCard label="Đã thanh toán" value={fmtVND(lineItems.reduce((s, l) => s + (l.paidAmount || 0), 0))} tone="#5FB77E" />
                <StatCard label="Còn nợ" value={fmtVND(lineItems.reduce((s, l) => s + (l.actualValue - (l.paidAmount || 0)), 0))} tone="#C1443C" />
              </div>

              <table className="mv-quote-table">
                <thead>
                  <tr>
                    <th>Hạng mục</th>
                    <th>SL</th>
                    <th>Đơn giá</th>
                    <th className="mv-no-print">Phát sinh</th>
                    <th className="mv-no-print">Thực chi</th>
                    <th className="mv-no-print">Đã TT</th>
                    <th className="mv-no-print">Còn nợ</th>
                    <th className="mv-no-print"></th>
                  </tr>
                </thead>
                {grouped.map(({ group, items }) => (
                  <tbody key={group}>
                    <tr className="mv-quote-group-row">
                      <td colSpan={8}>{group}</td>
                    </tr>
                    {items.map((l) => {
                      const debt = l.actualValue - (l.paidAmount || 0);
                      return confirmRemove === l.id ? (
                        <tr key={l.id}><td colSpan={8}><ConfirmBar text={`Xoá hạng mục "${l.name}"?`} onConfirm={() => deleteLineItem(l.id)} onCancel={() => setConfirmRemove(null)} /></td></tr>
                      ) : (
                        <tr key={l.id} className="mv-quote-row-clickable" onClick={() => { setEditingLineItem(l); setShowLineItemForm(true); }}>
                          <td>{l.name}{l.notes && <div className="mv-row-sub">{l.notes}</div>}</td>
                          <td className="mv-mono-date">{l.quantity || 1}</td>
                          <td className="mv-mono-money">{fmtVND(l.unitPrice || 0)}</td>
                          <td className="mv-mono-money mv-no-print" style={{ color: (l.extraAmount || 0) > 0 ? "#C1443C" : undefined }}>{fmtVND(l.extraAmount || 0)}</td>
                          <td className="mv-mono-money mv-no-print">{fmtVND(l.actualValue)}</td>
                          <td className="mv-mono-money mv-no-print" style={{ color: "#5FB77E" }}>{fmtVND(l.paidAmount || 0)}</td>
                          <td className="mv-no-print">
                            {debt > 0 ? <span className="mv-debt-badge">{fmtVND(debt)}</span> : <span className="mv-paid-badge">Đã trả đủ</span>}
                          </td>
                          <td className="mv-no-print" onClick={(e) => e.stopPropagation()}>
                            <button className="mv-icon-btn" onClick={() => { setEditingLineItem(l); setShowLineItemForm(true); }}><Pencil size={14} /></button>
                            <button className="mv-icon-btn" onClick={() => setConfirmRemove(l.id)}><Trash2 size={14} /></button>
                            {debt > 0 && <button className="mv-icon-btn" title="Đánh dấu đã trả đủ" onClick={() => markLineItemPaid(l.id, l.actualValue)}><CheckCircle2 size={14} /></button>}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                ))}
                <tbody className="mv-quote-totals-body">
                  <tr>
                    <td colSpan={3} className="mv-quote-total-label">Tổng theo đơn giá</td>
                    <td className="mv-quote-amount-cell mv-mono-money">{fmtVND(subtotal)}</td>
                    <td colSpan={4} className="mv-no-print"></td>
                  </tr>
                  <tr>
                    <td colSpan={3} className="mv-quote-total-label">Tổng phát sinh (báo khách)</td>
                    <td className="mv-quote-amount-cell mv-mono-money" style={{ color: totalExtra > 0 ? "#C1443C" : undefined }}>{fmtVND(totalExtra)}</td>
                    <td colSpan={4} className="mv-no-print"></td>
                  </tr>
                  <tr className="mv-no-print">
                    <td colSpan={4} className="mv-quote-total-label">Tổng thực chi (nội bộ)</td>
                    <td className="mv-mono-money" style={{ fontWeight: 700 }}>{fmtVND(lineItems.reduce((s, l) => s + l.actualValue, 0))}</td>
                    <td colSpan={3}></td>
                  </tr>
                  <tr>
                    <td colSpan={3} className="mv-quote-total-label">Tổng báo khách (chưa VAT)</td>
                    <td className="mv-quote-amount-cell mv-mono-money">{fmtVND(billableTotal)}</td>
                    <td colSpan={4} className="mv-no-print"></td>
                  </tr>
                  <tr>
                    <td colSpan={3} className="mv-quote-total-label">Thuế VAT (8%)</td>
                    <td className="mv-quote-amount-cell mv-mono-money">{fmtVND(vat)}</td>
                    <td colSpan={4} className="mv-no-print"></td>
                  </tr>
                  <tr>
                    <td colSpan={3} className="mv-quote-total-label">TỔNG SAU VAT</td>
                    <td className="mv-quote-amount-cell mv-mono-money mv-quote-total-value">{fmtVND(totalWithVat)}</td>
                    <td colSpan={4} className="mv-no-print"></td>
                  </tr>
                </tbody>
              </table>
              </>
            );
          })()}
        </div>
        </>
      )}

      {tab === "timeline" && (
        <div className="mv-panel">
          <div className="mv-panel-head">
            <h3 className="mv-panel-title"><Calendar size={16} /> Timeline / mốc tiến độ</h3>
            <div style={{ display: "flex", gap: 8 }}>
              <div className="mv-view-toggle">
                <button className={timelineView === "list" ? "mv-view-toggle-active" : ""} onClick={() => setTimelineView("list")}>Danh sách</button>
                <button className={timelineView === "calendar" ? "mv-view-toggle-active" : ""} onClick={() => setTimelineView("calendar")}>Lịch</button>
              </div>
              <button className="mv-btn mv-btn-primary mv-btn-sm" onClick={() => { setEditingMilestone(null); setShowMilestoneForm(true); }}><Plus size={14} /> Thêm mốc</button>
            </div>
          </div>
          {timelineView === "calendar" ? (
            <MilestoneCalendar
              milestones={milestones}
              onEdit={(m) => { setEditingMilestone(m); setShowMilestoneForm(true); }}
              onAddOnDate={addMilestoneOnDate}
              onMoveToDate={moveMilestoneToDate}
              onDelete={deleteMilestone}
              timelineCatalog={data.timelineCatalog}
              projectName={project.name}
            />
          ) : (
            <>
            {milestones.length === 0 && <p className="mv-empty-note">Chưa có mốc tiến độ nào.</p>}
            <div className="mv-filmstrip">
              {milestones.map((m) => (
                confirmRemove === m.id ? (
                  <ConfirmBar key={m.id} text={`Xoá mốc "${m.name}"?`} onConfirm={() => deleteMilestone(m.id)} onCancel={() => setConfirmRemove(null)} />
                ) : (
                  <div key={m.id} className="mv-milestone">
                    <div className="mv-milestone-dot" style={{ background: STATUS_META[m.status]?.color }} />
                    <div className="mv-milestone-body">
                      <div className="mv-row-title">{m.name}</div>
                      <div className="mv-row-sub mv-mono-date">{fmtDate(m.date)}</div>
                    </div>
                    <Badge status={m.status} />
                    <button className="mv-icon-btn" onClick={() => { setEditingMilestone(m); setShowMilestoneForm(true); }}><Pencil size={14} /></button>
                    <button className="mv-icon-btn" onClick={() => setConfirmRemove(m.id)}><Trash2 size={14} /></button>
                  </div>
                )
              ))}
            </div>
            </>
          )}
          {showMilestoneForm && <MilestoneForm initial={editingMilestone} onClose={() => { setShowMilestoneForm(false); setEditingMilestone(null); }} onSave={saveMilestone} />}
        </div>
      )}

      {tab === "crew" && (
        <div className="mv-panel">
          <div className="mv-panel-head">
            <h3 className="mv-panel-title"><Users size={16} /> Nhân sự tham gia dự án</h3>
            <button className="mv-btn mv-btn-primary mv-btn-sm" onClick={addCrewMember}><Plus size={14} /> Thêm nhân sự</button>
          </div>
          {crewList.length === 0 && <p className="mv-empty-note">Chưa có nhân sự nào được gán vào dự án này. Bấm "Thêm nhân sự" hoặc kéo hạng mục nhóm "Nhân sự" ở tab Dòng tiền và chọn người phụ trách.</p>}
          {crewList.length > 0 && (
            <div className="mv-stats-row mv-stats-row-sm" style={{ gridTemplateColumns: "repeat(3, 1fr)" }}>
              <StatCard label="Tổng thù lao" value={fmtVND(crewList.reduce((s, l) => s + l.actualValue, 0))} />
              <StatCard label="Đã thanh toán" value={fmtVND(crewList.reduce((s, l) => s + (l.paidAmount || 0), 0))} tone="#5FB77E" />
              <StatCard label="Còn nợ" value={fmtVND(crewList.reduce((s, l) => s + (l.actualValue - (l.paidAmount || 0)), 0))} tone="#C1443C" />
            </div>
          )}
          {crewList.map((l) => {
            const debt = l.actualValue - (l.paidAmount || 0);
            return confirmRemove === l.id ? (
              <ConfirmBar key={l.id} text={`Bỏ ${l.person?.name || "nhân sự"} khỏi dự án?`} onConfirm={() => deleteLineItem(l.id)} onCancel={() => setConfirmRemove(null)} />
            ) : (
              <div key={l.id} className="mv-row-card mv-row-card-wrap mv-quote-row-clickable" onClick={() => { setEditingLineItem(l); setShowLineItemForm(true); }}>
                <div>
                  <div className="mv-row-title">{l.person?.name || "(đã xoá khỏi danh sách)"}</div>
                  <div className="mv-row-sub">{l.name || l.person?.role} · {l.person?.phone}</div>
                  {(l.extraAmount || 0) > 0 && <div className="mv-row-sub">Bao gồm phát sinh: {fmtVND(l.extraAmount)}</div>}
                </div>
                <div className="mv-row-right mv-assignment-pay" onClick={(e) => e.stopPropagation()}>
                  <div className="mv-assignment-pay-nums">
                    <span className="mv-mono-money">{fmtVND(l.actualValue)}</span>
                    <span className={debt > 0 ? "mv-debt-badge" : "mv-paid-badge"}>
                      {debt > 0 ? `Còn nợ ${fmtVND(debt)}` : "Đã trả đủ"}
                    </span>
                  </div>
                  {debt > 0 && (
                    <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => markLineItemPaid(l.id, l.actualValue)}>Đánh dấu đã trả đủ</button>
                  )}
                  <button className="mv-icon-btn" onClick={() => { setEditingLineItem(l); setShowLineItemForm(true); }}><Pencil size={14} /></button>
                  <button className="mv-icon-btn" onClick={() => setConfirmRemove(l.id)}><Trash2 size={14} /></button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {showLineItemForm && (
        <LineItemForm
          initial={editingLineItem}
          onClose={() => { setShowLineItemForm(false); setEditingLineItem(null); }}
          onSave={saveLineItem}
          personnel={data.personnel}
          onQuickAddPersonnel={quickAddPersonnel}
        />
      )}
    </div>
  );
}

/* --------------------------------- personnel page ------------------------------ */

function PersonnelPage({ data, persist }) {
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [query, setQuery] = useState("");

  const save = (p) => {
    const next = { ...data };
    next.personnel = p.id ? data.personnel.map((x) => (x.id === p.id ? p : x)) : [...data.personnel, { ...p, id: uid() }];
    persist(next);
    setShowForm(false);
    setEditing(null);
  };

  const del = (id) => {
    persist({
      ...data,
      personnel: data.personnel.filter((p) => p.id !== id),
      lineItems: data.lineItems.map((l) => (l.personnelId === id ? { ...l, personnelId: "" } : l)),
    });
    setConfirmDelete(null);
  };

  const filtered = data.personnel.filter((p) => (p.name + p.role).toLowerCase().includes(query.toLowerCase()));

  const crewItemsOf = (personnelId) => data.lineItems.filter((l) => l.group === "Nhân sự" && l.personnelId === personnelId);
  const projectCount = (personnelId) => new Set(crewItemsOf(personnelId).map((l) => l.projectId)).size;
  const debtOf = (personnelId) =>
    crewItemsOf(personnelId).reduce((s, l) => s + (l.actualValue - (l.paidAmount || 0)), 0);
  const totalDebtAll = data.personnel.reduce((s, p) => s + debtOf(p.id), 0);

  return (
    <div>
      <div className="mv-toolbar">
        <div className="mv-search">
          <Search size={16} />
          <input placeholder="Tìm nhân sự theo tên hoặc vai trò..." value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
        <button className="mv-btn mv-btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}><Plus size={16} /> Thêm nhân sự</button>
      </div>

      {data.personnel.length > 0 && (
        <div className="mv-stats-row mv-stats-row-sm" style={{ gridTemplateColumns: "repeat(2, 1fr)", maxWidth: 480 }}>
          <StatCard label="Số nhân sự" value={data.personnel.length} />
          <StatCard label="Tổng công nợ chưa trả" value={fmtVND(totalDebtAll)} tone={totalDebtAll > 0 ? "#C1443C" : "#5FB77E"} />
        </div>
      )}

      {filtered.length === 0 && <p className="mv-empty-note">Chưa có nhân sự nào.</p>}

      <div className="mv-crew-grid">
        {filtered.map((p) => (
          confirmDelete === p.id ? (
            <div key={p.id} className="mv-panel"><ConfirmBar text={`Xoá nhân sự "${p.name}"? Nhân sự sẽ được gỡ khỏi mọi dự án.`} onConfirm={() => del(p.id)} onCancel={() => setConfirmDelete(null)} /></div>
          ) : (
            <div key={p.id} className="mv-crew-card">
              <div className="mv-crew-avatar">{p.name.split(" ").slice(-1)[0]?.[0] || "?"}</div>
              <div className="mv-crew-info">
                <div className="mv-row-title">{p.name}</div>
                <div className="mv-row-sub">{p.role}</div>
                <div className="mv-crew-contact">
                  {p.phone && <span><Phone size={12} /> {p.phone}</span>}
                  {p.email && <span><Mail size={12} /> {p.email}</span>}
                </div>
                <div className="mv-row-sub">Đơn giá: <span className="mv-mono-money">{fmtVND(p.dayRate)}</span>/ngày · {projectCount(p.id)} dự án</div>
                {debtOf(p.id) > 0 && (
                  <div className="mv-debt-badge" style={{ marginTop: 6, display: "inline-block" }}>Đang nợ {fmtVND(debtOf(p.id))}</div>
                )}
              </div>
              <div className="mv-row-right mv-crew-actions">
                <button className="mv-icon-btn" onClick={() => { setEditing(p); setShowForm(true); }}><Pencil size={14} /></button>
                <button className="mv-icon-btn" onClick={() => setConfirmDelete(p.id)}><Trash2 size={14} /></button>
              </div>
            </div>
          )
        ))}
      </div>

      {showForm && <PersonnelForm initial={editing} onClose={() => { setShowForm(false); setEditing(null); }} onSave={save} />}
    </div>
  );
}

/* ------------------------------ auth settings UI ------------------------------ */

function AuthStatusLine({ status, lastSyncedAt, errorMsg }) {
  const map = {
    disconnected: { icon: CloudOff, text: "Chưa đăng nhập", color: "var(--text-muted)" },
    connecting: { icon: RefreshCw, text: "Đang kết nối...", color: "var(--gold)", spin: true },
    syncing: { icon: RefreshCw, text: "Đang đồng bộ...", color: "var(--gold)", spin: true },
    synced: { icon: Cloud, text: lastSyncedAt ? `Đã đồng bộ lúc ${lastSyncedAt.toLocaleTimeString("vi-VN")}` : "Đã đồng bộ", color: "var(--green)" },
    offline: { icon: WifiOff, text: "Mất mạng — sẽ tự đồng bộ khi có mạng", color: "var(--gold)" },
    error: { icon: CloudOff, text: errorMsg || "Lỗi đồng bộ", color: "var(--red)" },
    conflict: { icon: AlertCircle, text: "Dữ liệu khác nhau giữa máy và server", color: "var(--red)" },
  };
  const m = map[status] || map.disconnected;
  const Ic = m.icon;
  return (
    <div className="mv-drive-status" style={{ color: m.color }}>
      <Ic size={13} className={m.spin ? "mv-spin" : ""} />
      <span>{m.text}</span>
    </div>
  );
}

function AuthSettingsModal({ sync, onClose }) {
  const [url, setUrl] = useState(sync.supabaseUrl);
  const [key, setKey] = useState(sync.supabaseKey);
  const [mode, setMode] = useState("signin"); // signin | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const hasCreds = !!sync.supabaseUrl && !!sync.supabaseKey;
  const isLoggedIn = !!sync.user;

  return (
    <Modal title="Đăng nhập & đồng bộ" onClose={onClose} wide>
      <p className="mv-drive-intro">
        Dữ liệu công ty được lưu trên máy chủ riêng của bạn (Supabase), đăng nhập bằng email/mật khẩu —
        dùng được trên mọi thiết bị, không cần kết nối lại mỗi lần. App vẫn hoạt động khi mất mạng,
        dữ liệu tự đồng bộ lại khi có mạng.
      </p>

      {!hasCreds || !sync.scriptReady ? (
        <>
          <div className="mv-form-grid">
            <Field label="Supabase Project URL"><input className="mv-input" placeholder="https://xxxx.supabase.co" value={url} onChange={(e) => setUrl(e.target.value)} /></Field>
            <Field label="Supabase anon public key"><input className="mv-input" placeholder="eyJhbGciOi..." value={key} onChange={(e) => setKey(e.target.value)} /></Field>
          </div>
          <button className="mv-btn mv-btn-ghost mv-btn-sm" disabled={!url.trim() || !key.trim()} onClick={() => sync.saveCredentials(url, key)}>
            Lưu thông tin kết nối
          </button>
          {sync.scriptError && <p className="mv-drive-script-error">Không tải được thư viện đồng bộ — kiểm tra lại mạng rồi thử lại.</p>}
          <p className="mv-drive-hint">Chưa có thông tin này? Làm theo hướng dẫn "Thiết lập Supabase" đi kèm để lấy trong khoảng 5 phút.</p>
        </>
      ) : isLoggedIn ? (
        <>
          <div className="mv-drive-divider" />
          <AuthStatusLine status={sync.status} lastSyncedAt={sync.lastSyncedAt} errorMsg={sync.errorMsg} />
          <p className="mv-row-sub" style={{ marginTop: 8 }}>Đăng nhập với: {sync.user.email}</p>
          <div className="mv-modal-actions" style={{ justifyContent: "flex-start", marginTop: 14 }}>
            <button className="mv-btn mv-btn-ghost" onClick={sync.signOut}><Unlink size={15} /> Đăng xuất</button>
          </div>
        </>
      ) : (
        <>
          <div className="mv-drive-divider" />
          <div className="mv-view-toggle" style={{ marginBottom: 14 }}>
            <button className={mode === "signin" ? "mv-view-toggle-active" : ""} onClick={() => setMode("signin")}>Đăng nhập</button>
            <button className={mode === "signup" ? "mv-view-toggle-active" : ""} onClick={() => setMode("signup")}>Đăng ký</button>
          </div>
          <Field label="Email"><input type="email" className="mv-input" value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
          <Field label="Mật khẩu"><input type="password" className="mv-input" value={password} onChange={(e) => setPassword(e.target.value)} placeholder={mode === "signup" ? "Tối thiểu 6 ký tự" : ""} /></Field>
          {sync.errorMsg && <p className="mv-drive-script-error">{sync.errorMsg}</p>}
          <div className="mv-modal-actions" style={{ justifyContent: "flex-start", marginTop: 14 }}>
            <button
              className="mv-btn mv-btn-primary"
              disabled={!email.trim() || password.length < 6 || sync.status === "connecting"}
              onClick={() => (mode === "signup" ? sync.signUp(email, password) : sync.signIn(email, password))}
            >
              <Cloud size={15} /> {mode === "signup" ? "Đăng ký" : "Đăng nhập"}
            </button>
          </div>
        </>
      )}
    </Modal>
  );
}

function SyncConflictModal({ conflict, onResolve }) {
  const localCount = conflict.local?.projects?.length || 0;
  const remoteCount = conflict.remote?.projects?.length || 0;
  const localTime = conflict.local?._meta?.updatedAt ? new Date(conflict.local._meta.updatedAt).toLocaleString("vi-VN") : "không rõ";
  const remoteTime = conflict.remote?._meta?.updatedAt ? new Date(conflict.remote._meta.updatedAt).toLocaleString("vi-VN") : "không rõ";
  return (
    <Modal title="Dữ liệu không khớp" onClose={() => {}}>
      <p className="mv-drive-intro">
        Dữ liệu trên máy này khác với dữ liệu đang lưu trên server. Chọn bản bạn muốn giữ
        (bản còn lại sẽ bị ghi đè).
      </p>
      <div className="mv-conflict-grid">
        <div className="mv-conflict-card">
          <div className="mv-detail-label">Trên máy này</div>
          <div className="mv-detail-value">{localCount} dự án</div>
          <div className="mv-row-sub mv-mono-date">Cập nhật {localTime}</div>
          <button className="mv-btn mv-btn-primary mv-btn-sm" style={{ marginTop: 10 }} onClick={() => onResolve("local")}>Dùng bản này</button>
        </div>
        <div className="mv-conflict-card">
          <div className="mv-detail-label">Trên server</div>
          <div className="mv-detail-value">{remoteCount} dự án</div>
          <div className="mv-row-sub mv-mono-date">Cập nhật {remoteTime}</div>
          <button className="mv-btn mv-btn-primary mv-btn-sm" style={{ marginTop: 10 }} onClick={() => onResolve("remote")}>Dùng bản này</button>
        </div>
      </div>
    </Modal>
  );
}

/* ----------------------------------- shell ------------------------------------ */

function App() {
  const { data, loading, saveError, persist, resetToSample, clearAll, sync } = useAppData();
  const [view, setView] = useState("dashboard");
  const [activeProjectId, setActiveProjectId] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [resetConfirmText, setResetConfirmText] = useState("");
  const [showDriveModal, setShowDriveModal] = useState(false);
  const [restoreError, setRestoreError] = useState("");
  const restoreInputRef = useRef(null);

  const openProject = (id) => { setActiveProjectId(id); setView("project"); };

  const handleDownloadBackup = () => {
    if (!data) return;
    downloadJSON(data, `studio-slate-backup-${todayISO()}.json`);
  };

  const handleRestoreFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setRestoreError("");
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        const normalized = normalizeData(parsed);
        if (!Array.isArray(normalized.projects)) throw new Error("File không đúng định dạng.");
        persist(normalized);
      } catch (err) {
        setRestoreError("Không đọc được file này — hãy chắc chắn đây là file sao lưu .json do app này tạo ra.");
      }
    };
    reader.readAsText(file);
  };

  const NAV = [
    { id: "dashboard", label: "Tổng quan", icon: LayoutDashboard },
    { id: "projects", label: "Dự án", icon: Film },
    { id: "personnel", label: "Nhân sự", icon: Users },
  ];

  return (
    <div className="mv-app">
      <style>{CSS}</style>
      <div className="mv-shell">
        <aside className="mv-sidebar">
          <div className="mv-brand">
            <img src={LOGO_DATA_URI} alt="Logo công ty" className="mv-brand-logo" />
            <div>
              <div className="mv-brand-title">Quản Lí Công Ty</div>
              <div className="mv-brand-sub">Quản lý sản xuất MV</div>
            </div>
          </div>
          <nav className="mv-nav">
            {NAV.map((n) => (
              <button
                key={n.id}
                className={`mv-nav-item ${view === n.id || (n.id === "projects" && view === "project") ? "mv-nav-active" : ""}`}
                onClick={() => { setView(n.id); setActiveProjectId(null); }}
              >
                <n.icon size={17} /> {n.label}
              </button>
            ))}
          </nav>
          <div className="mv-sidebar-footer">
            {saveError && <div className="mv-save-error">Lưu dữ liệu thất bại. Thay đổi có thể chưa được lưu.</div>}

            <button className="mv-drive-trigger" onClick={() => setShowDriveModal(true)}>
              <AuthStatusLine status={sync.status} lastSyncedAt={sync.lastSyncedAt} errorMsg={sync.errorMsg} />
              <Settings size={13} />
            </button>

            <div className="mv-backup-actions">
              <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={handleDownloadBackup}>
                <FileText size={13} /> Tải bản sao lưu
              </button>
              <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => restoreInputRef.current?.click()}>
                <RefreshCw size={13} /> Khôi phục từ file
              </button>
              <input ref={restoreInputRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleRestoreFile} />
            </div>
            {restoreError && <div className="mv-save-error">{restoreError}</div>}

            {confirmReset ? (
              <div className="mv-reset-confirm">
                <span>Thao tác này sẽ <strong>xoá toàn bộ dữ liệu hiện tại</strong> và thay bằng dữ liệu mẫu. Gõ chính xác <strong>XOA</strong> để xác nhận:</span>
                <input
                  className="mv-input mv-btn-sm"
                  style={{ marginTop: 6, marginBottom: 6 }}
                  value={resetConfirmText}
                  onChange={(e) => setResetConfirmText(e.target.value)}
                  placeholder="Gõ XOA để xác nhận"
                />
                <div>
                  <button className="mv-btn mv-btn-ghost mv-btn-sm" onClick={() => { setConfirmReset(false); setResetConfirmText(""); }}>Huỷ</button>
                  <button
                    className="mv-btn mv-btn-danger mv-btn-sm"
                    disabled={resetConfirmText.trim().toUpperCase() !== "XOA"}
                    onClick={() => { resetToSample(); setConfirmReset(false); setResetConfirmText(""); }}
                  >
                    Khôi phục
                  </button>
                </div>
              </div>
            ) : (
              <button className="mv-reset-link" onClick={() => setConfirmReset(true)}>Khôi phục dữ liệu mẫu</button>
            )}
          </div>
        </aside>

        <main className="mv-main">
          {loading || !data ? (
            <div className="mv-loading"><Loader2 className="mv-spin" size={22} /> Đang tải dữ liệu...</div>
          ) : (
            <>
              {view === "dashboard" && <Dashboard data={data} openProject={openProject} />}
              {view === "projects" && <ProjectsList data={data} persist={persist} openProject={openProject} />}
              {view === "project" && <ProjectDetail data={data} persist={persist} projectId={activeProjectId} back={() => setView("projects")} />}
              {view === "personnel" && <PersonnelPage data={data} persist={persist} />}
            </>
          )}
        </main>
      </div>

      {showDriveModal && <AuthSettingsModal sync={sync} onClose={() => setShowDriveModal(false)} />}
      {sync.conflict && <SyncConflictModal conflict={sync.conflict} onResolve={sync.resolveConflict} />}
    </div>
  );
}

  --surface: #1D1A16;

  --gold: #D4A537;
  --teal: #3FA9A0;
  --green: #5FB77E;
  --red: #C1443C;
  --text: #F5F1E8;
  --text-muted: #9C948A;
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  border-radius: 12px;
  overflow: hidden;
}
.mv-app * { box-sizing: border-box; }
.mv-shell { display: flex; min-height: 640px; }

.mv-sidebar {
  width: 220px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border); padding: 20px 14px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.mv-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 28px; padding: 0 4px; }
.mv-brand-logo { width: 100%; max-width: 190px; height: auto; object-fit: contain; }
.mv-brand-title { font-family: 'Oswald', sans-serif; font-weight: 600; letter-spacing: 0.06em; font-size: 14px; }
.mv-brand-sub { font-size: 11px; color: var(--text-muted); }
.mv-nav { display: flex; flex-direction: column; gap: 3px; }
.mv-nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px;
  background: none; border: none; color: var(--text-muted); font-size: 13.5px; font-weight: 500;
  cursor: pointer; text-align: left; font-family: inherit;
}
.mv-nav-item:hover { background: var(--surface-2); color: var(--text); }
.mv-nav-active { background: var(--surface-2); color: var(--gold); }
.mv-sidebar-footer { display: flex; flex-direction: column; gap: 8px; }
.mv-backup-actions { display: flex; flex-direction: column; gap: 6px; }
.mv-backup-actions .mv-btn { justify-content: flex-start; }
.mv-reset-link { background: none; border: none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; text-decoration: underline; text-align: left; padding: 0; }
.mv-reset-confirm { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11.5px; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px; }
.mv-save-error { font-size: 11px; color: var(--red); }

.mv-main { flex: 1; padding: 26px 30px; overflow-y: auto; max-height: 90vh; }
.mv-loading { display: flex; align-items: center; gap: 10px; color: var(--text-muted); padding: 60px 0; justify-content: center; }
.mv-spin { animation: mv-spin 1s linear infinite; }
@keyframes mv-spin { to { transform: rotate(360deg); } }

.mv-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.mv-stats-row-sm { grid-template-columns: repeat(4, 1fr); margin-bottom: 16px; }
.mv-stats-row-5 { grid-template-columns: repeat(5, 1fr); }
.mv-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.mv-stat-label { font-size: 11.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.mv-stat-value { font-family: 'JetBrains Mono', monospace; font-size: 19px; font-weight: 600; }
.mv-stat-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.mv-dash-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
.mv-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.mv-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.mv-panel-title { display: flex; align-items: center; gap: 8px; font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text); margin: 0 0 14px 0; }
.mv-panel-head .mv-panel-title { margin-bottom: 0; }

.mv-mini-row { padding: 10px 8px; border-radius: 8px; cursor: pointer; border-bottom: 1px solid var(--border); }
.mv-mini-row:last-child { border-bottom: none; }
.mv-mini-row:hover { background: var(--surface-2); }
.mv-mini-row-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.mv-mini-name { font-size: 13.5px; font-weight: 500; }
.mv-mini-sub { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.mv-progress { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
.mv-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--teal)); border-radius: 3px; transition: width 0.3s; }

.mv-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 3px 8px; border-radius: 20px; background: color-mix(in srgb, var(--badge-color) 16%, transparent);
  color: var(--badge-color); white-space: nowrap;
}

.mv-toolbar { display: flex; gap: 10px; margin-bottom: 18px; align-items: center; }
.mv-search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; flex: 1; color: var(--text-muted); }
.mv-search input { background: none; border: none; outline: none; color: var(--text); font-size: 13.5px; width: 100%; font-family: inherit; }
.mv-filter { width: 170px; }

.mv-input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 7px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; outline: none;
}
.mv-input:focus { border-color: var(--gold); }

.mv-btn {
  display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 8px;
  padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
}
.mv-btn-sm { padding: 6px 10px; font-size: 12px; }
.mv-btn-primary { background: var(--gold); color: #1D1A16; }
.mv-btn-primary:hover { filter: brightness(1.08); }
.mv-btn-ghost { background: none; color: var(--text-muted); border: 1px solid var(--border); }
.mv-btn-ghost:hover { color: var(--text); }
.mv-btn-danger { background: var(--red); color: #fff; }

.mv-icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 6px; display: inline-flex; }
.mv-icon-btn:hover { background: var(--surface-2); color: var(--text); }
.mv-icon-btn-light { color: rgba(255,255,255,0.75); }
.mv-icon-btn-light:hover { background: rgba(255,255,255,0.12); color: #fff; }

.mv-empty-note { color: var(--text-muted); font-size: 13px; padding: 10px 2px; }

.mv-slate-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.mv-slate { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.mv-slate-confirm { padding: 14px; }
.mv-slate-clap { height: 26px; background: repeating-linear-gradient(-45deg, #0F0D0B, #0F0D0B 10px, var(--gold) 10px, var(--gold) 20px); position: relative; display: flex; justify-content: flex-end; align-items: center; padding: 0 6px; }
.mv-slate-clap-actions { display: flex; gap: 2px; background: rgba(0,0,0,0.35); border-radius: 6px; padding: 1px; }
.mv-slate-body { padding: 16px; cursor: pointer; }
.mv-slate-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; margin-bottom: 6px; gap: 10px; }
.mv-slate-row span { color: var(--text-muted); font-size: 10.5px; letter-spacing: 0.06em; }
.mv-slate-row strong { font-weight: 600; text-align: right; }
.mv-slate-footer { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 8px; }
.mv-slate-open { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 12px; color: var(--gold); margin-top: 10px; font-weight: 600; }

.mv-mono-date, .mv-mono-money { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); }
.mv-mono-money { color: var(--text); font-weight: 600; }

.mv-back { background: none; border: none; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; margin-bottom: 16px; padding: 0; font-family: inherit; }
.mv-back:hover { color: var(--text); }

.mv-project-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
.mv-project-head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.mv-eyebrow { font-size: 10.5px; letter-spacing: 0.1em; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
.mv-project-head h2 { font-family: 'Oswald', sans-serif; font-size: 24px; margin: 0 0 4px; font-weight: 600; }
.mv-project-sub { color: var(--text-muted); font-size: 13px; }

.mv-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.mv-tab { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-muted); padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
.mv-tab:hover { color: var(--text); }
.mv-tab-active { color: var(--gold); border-bottom-color: var(--gold); }

.mv-overview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.mv-detail-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.mv-detail-value { font-size: 15px; font-weight: 600; }
.mv-overview-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.mv-overview-progress .mv-progress { flex: 1; }
.mv-inline-progress-edit input { width: 100%; accent-color: var(--gold); }
.mv-desc { color: var(--text-muted); font-size: 13.5px; line-height: 1.6; margin: 4px 0 0; }

.mv-row-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.mv-row-card:last-child { border-bottom: none; }
.mv-row-title { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.mv-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.mv-row-right { display: flex; align-items: center; gap: 8px; }
.mv-row-txn-icon { display: flex; }

.mv-filmstrip { position: relative; padding-left: 4px; }
.mv-milestone { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px dashed var(--border); }
.mv-milestone:last-child { border-bottom: none; }
.mv-milestone-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.mv-milestone-body { flex: 1; }

.mv-crew-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.mv-crew-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
.mv-crew-avatar { width: 40px; height: 40px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'Oswald', sans-serif; flex-shrink: 0; }
.mv-crew-info { flex: 1; }
.mv-crew-contact { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--text-muted); margin: 6px 0; }
.mv-crew-contact span { display: flex; align-items: center; gap: 5px; }
.mv-crew-actions { flex-direction: column; }

.mv-modal-overlay { position: fixed; inset: 0; background: rgba(10,9,7,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
.mv-modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 420px; max-width: 100%; max-height: 85vh; overflow-y: auto; }
.mv-modal-wide { width: 560px; }
.mv-modal-xl { width: 860px; }
.mv-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.mv-modal-head h3 { margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; }
.mv-modal-body { padding: 18px; }
.mv-modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.mv-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.mv-field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
.mv-checkbox-field { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; cursor: pointer; }
.mv-checkbox-field input { accent-color: var(--gold); width: 15px; height: 15px; }
.mv-extra-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em; color: var(--gold); background: color-mix(in srgb, var(--gold) 16%, transparent); border-radius: 10px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; }
.mv-debt-badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); border-radius: 8px; padding: 2px 8px; }
.mv-paid-badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); border-radius: 8px; padding: 2px 8px; }
.mv-row-card-wrap { flex-wrap: wrap; }
.mv-assignment-pay { flex-direction: column; align-items: flex-end; gap: 6px; }
.mv-assignment-pay-nums { display: flex; align-items: center; gap: 8px; }

.mv-view-toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.mv-view-toggle button { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; }
.mv-view-toggle-active { background: var(--gold) !important; color: #1D1A16 !important; }

.mv-calendar-head { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 12px; }
.mv-calendar-title { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; min-width: 140px; text-align: center; }
.mv-calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.mv-calendar-weekday { text-align: center; font-size: 11px; color: var(--text-muted); font-weight: 600; padding: 4px 0; }
.mv-calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(72px, auto); gap: 4px; }
.mv-calendar-cell { border: 1px solid var(--border); border-radius: 8px; padding: 5px; background: var(--surface-2); overflow: hidden; }
.mv-calendar-cell-blank { border: none; background: none; }
.mv-calendar-cell-today { border-color: var(--gold); }
.mv-calendar-cell-dragover { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface-2)); }
.mv-calendar-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.mv-print-only { display: none; }
.mv-print-header { display: none; align-items: center; gap: 12px; }
.mv-print-logo { height: 34px; width: auto; }
.mv-calendar-daynum { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 3px; }
.mv-calendar-cell-today .mv-calendar-daynum { color: var(--gold); font-weight: 700; }
.mv-calendar-chips { display: flex; flex-direction: column; gap: 2px; }
.mv-calendar-chip {
  display: block; width: 100%; text-align: left; background: color-mix(in srgb, var(--chip-color) 20%, transparent);
  color: var(--text); border: none; border-left: 3px solid var(--chip-color); border-radius: 3px;
  font-size: 10.5px; padding: 2px 5px; cursor: grab; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-family: inherit;
}
.mv-calendar-chip:active { cursor: grabbing; }
.mv-calendar-chip-wrap { position: relative; }
.mv-calendar-chip-wrap .mv-calendar-chip { padding-right: 16px; }
.mv-calendar-chip-delete {
  position: absolute; top: 2px; right: 2px; width: 13px; height: 13px; padding: 0;
  display: none; align-items: center; justify-content: center; border: none; border-radius: 50%;
  background: rgba(0,0,0,0.5); color: #fff; cursor: pointer;
}
.mv-calendar-chip-wrap:hover .mv-calendar-chip-delete { display: flex; }
.mv-calendar-chip-delete:hover { background: var(--red); }

.mv-lineitem-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: var(--surface-2); }
.mv-lineitem-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.mv-lineitem-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mv-lineitem-col { display: flex; flex-direction: column; gap: 3px; }
.mv-variance-note { display: block; font-size: 10px; color: var(--text-muted); font-weight: 500; }

.mv-quote-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
.mv-quote-table th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); padding: 8px 8px; border-bottom: 1px solid var(--border); }
.mv-quote-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.mv-quote-group-row td { padding: 10px 8px 4px; font-family: 'Oswald', sans-serif; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); border-bottom: 1px solid var(--gold); }
.mv-quote-row-clickable { cursor: pointer; }
.mv-quote-row-clickable:hover { background: var(--surface-2); }
.mv-quote-name-input { min-width: 160px; }
.mv-quote-num-input { width: 90px; }
.mv-quote-amount-cell { text-align: right; white-space: nowrap; font-weight: 600; }
.mv-quote-total-label { text-align: right; font-weight: 700; font-family: 'Oswald', sans-serif; letter-spacing: 0.03em; text-transform: uppercase; font-size: 12.5px; padding-top: 12px; }
.mv-quote-total-value { font-size: 15px; color: var(--gold); padding-top: 12px; }
.mv-quote-totals-body { break-inside: avoid; page-break-inside: avoid; }
.mv-print-sub { font-size: 12px; color: #444; margin-top: 2px; }

.mv-catalog { display: flex; flex-direction: column; gap: 12px; }
.mv-catalog-hint { font-size: 12px; color: var(--text-muted); }
.mv-catalog-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.mv-catalog-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mv-catalog-chip {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: grab; font-family: inherit;
}
.mv-catalog-chip:hover { border-color: var(--gold); color: var(--gold); }
.mv-catalog-chip:active { cursor: grabbing; }
.mv-catalog-add-trigger { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px dashed var(--border); color: var(--text-muted); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; align-self: flex-start; }
.mv-catalog-add-trigger:hover { color: var(--gold); border-color: var(--gold); }
.mv-catalog-add-form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mv-catalog-add-form .mv-input { width: auto; flex: 1; min-width: 140px; }

.mv-cashflow-summary { background: linear-gradient(135deg, var(--surface), var(--surface-2)); border-color: var(--gold); }
.mv-cashflow-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 4px; }
.mv-cashflow-stat { display: flex; flex-direction: column; gap: 4px; }
.mv-cashflow-value { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }

.mv-inline-timeline-section { margin-top: 8px; }
.mv-inline-timeline-title { display: flex; align-items: center; gap: 7px; font-family: 'Oswald', sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin: 4px 0 12px; }

.mv-wizard-steps { display: flex; align-items: center; gap: 6px; margin-bottom: 20px; }
.mv-wizard-step { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); padding: 5px 12px 5px 5px; border-radius: 20px; background: var(--surface-2); }
.mv-wizard-step-num { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: var(--border); color: var(--text-muted); font-size: 11px; font-family: 'JetBrains Mono', monospace; }
.mv-wizard-step-active { color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--surface-2)); }
.mv-wizard-step-active .mv-wizard-step-num { background: var(--gold); color: #1D1A16; }
.mv-wizard-step-done .mv-wizard-step-num { background: var(--green); color: #1D1A16; }
.mv-wizard-step-done { color: var(--green); }
.mv-inline-milestone-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.mv-inline-milestone-chip { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 6px 4px 12px; font-size: 12px; }

.mv-confirm { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: color-mix(in srgb, var(--red) 12%, var(--surface)); border: 1px solid var(--red); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
.mv-confirm > span { flex: 1; }

@media (max-width: 860px) {
  .mv-shell { flex-direction: column; }
  .mv-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; row-gap: 10px; }
  .mv-nav { flex-direction: row; }
  .mv-sidebar-footer { display: flex; width: 100%; order: 3; }
  .mv-dash-grid, .mv-overview-grid, .mv-form-grid { grid-template-columns: 1fr; }
  .mv-stats-row { grid-template-columns: repeat(2, 1fr); }
  .mv-lineitem-cols { grid-template-columns: repeat(2, 1fr); }
  .mv-cashflow-grid { grid-template-columns: repeat(2, 1fr); }
  .mv-stats-row-5 { grid-template-columns: repeat(2, 1fr); }
}
